<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>Z Patrimoine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12161A;
  --panel:#1B2027;
  --panel-2:#20262E;
  --line:#2C333C;
  --paper:#E9E5D8;
  --paper-dim:#A9A599;
  --teal:#4F9C82;
  --teal-dim:#376E5C;
  --rust:#B5563C;
  --gold:#C9A65D;
  --text:#EDEAE1;
  --text-dim:#9AA0A8;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0 0 4px;}
.mono{font-family:'IBM Plex Mono',monospace;}
header.top{padding:28px 32px 18px;border-bottom:1px solid var(--line);}
header.top .brand{margin-bottom:14px;display:flex;align-items:baseline;gap:8px;}
.brand-hero{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--text);letter-spacing:.01em;white-space:nowrap;}
.brand-hero .z{color:var(--gold);font-size:23px;font-weight:700;margin-right:1px;}
.ledger-row{display:flex;gap:36px;align-items:baseline;flex-wrap:wrap;}
.ledger-item .label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:4px;}
.ledger-item .value{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;}
.ledger-item.net .value{color:var(--gold);font-size:38px;}
.year-picker{display:flex;align-items:center;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:3px;width:fit-content;}
.year-picker button{background:none;border:none;color:var(--text-dim);font-size:17px;width:26px;height:26px;border-radius:50%;cursor:pointer;line-height:1;}
.year-picker button:hover:not(:disabled){background:var(--ink);color:var(--gold);}
.year-picker button:disabled{opacity:.25;cursor:default;}
.year-picker-value{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--gold);min-width:44px;text-align:center;}
.ledger-item.debt .value{color:var(--rust);}
.ledger-item.asset .value{color:var(--teal);}
nav.tabs{display:flex;gap:2px;padding:0 32px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;}
nav.tabs button{background:none;border:none;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:14px 16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
nav.tabs button.active{color:var(--text);border-bottom-color:var(--gold);}
.bottom-tabs{display:none;}
.settings-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
.settings-btn:hover{color:var(--text);border-color:var(--gold);}
.settings-btn .icon{width:15px;height:15px;display:inline-block;}
.settings-btn .icon svg{width:100%;height:100%;}
.more-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:6px;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;}
.more-row:active{background:var(--ink);}
.more-row .icon{width:19px;height:19px;flex-shrink:0;color:var(--text-dim);display:inline-block;}
.more-row .icon svg{width:100%;height:100%;display:block;}
.sheet-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin:16px 0 6px;}
.sheet-label:first-of-type{margin-top:4px;}
.sheet-group{display:flex;flex-direction:column;gap:4px;}
.icon-btn{background:none;border:none;padding:4px;cursor:pointer;color:var(--text-dim);width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;vertical-align:middle;}
.icon-btn svg{width:16px;height:16px;display:block;}
.icon-btn:hover{background:var(--panel-2);color:var(--text);}
.icon-btn.danger:hover{color:var(--rust);}
.icon-btn:disabled{opacity:.25;cursor:default;}
.icon-btn:disabled:hover{background:none;}
.drag-handle{cursor:grab;color:var(--text-dim);}
.drag-handle:active{cursor:grabbing;}
tr.dragging{opacity:.4;}
.scenario-ctx-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.scenario-ctx-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
.scenario-ctx-btn.active{background:var(--ink);color:var(--gold);border-color:var(--gold);font-weight:600;}
.mobile-summary{display:none;}
.dashboard-cards{display:none;}
.support-card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
.support-card.nested{margin-left:16px;background:var(--ink);}
.support-card.group{border-color:var(--gold);}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.sc-name{font-weight:600;font-size:14px;color:var(--text);}
.sc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.sc-value{font-family:'IBM Plex Mono',monospace;font-size:15px;text-align:right;white-space:nowrap;}
.sc-perf{display:flex;gap:24px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
.sc-perf-item{display:flex;flex-direction:column;gap:3px;}
.sc-perf-item .perf-link, .sc-perf-item .pill{font-size:14px;}
.sc-control{margin-top:9px;font-size:11px;color:var(--text-dim);}
.sc-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);}
main{padding:28px 32px 80px;max-width:1180px;margin:0 auto;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:20px;}
.card h3{font-size:16px;color:var(--text);margin-bottom:2px;}
.card .sub{font-size:12px;color:var(--text-dim);margin-bottom:14px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:13px;}
td.label-cell{font-family:'Inter',sans-serif;}
tr:hover{background:var(--panel-2);}
.pos{color:var(--teal);}
.neg{color:var(--rust);}
.pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);}
form.inline-form{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:18px;padding:16px;background:var(--panel-2);border-radius:6px;border:1px solid var(--line);}
form.inline-form .field{display:flex;flex-direction:column;gap:4px;}
form.inline-form label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);}
input,select{background:var(--ink);border:1px solid var(--line);color:var(--text);padding:7px 9px;border-radius:4px;font-family:'Inter',sans-serif;font-size:13px;min-width:110px;}
input[type=checkbox]{min-width:auto;}
button{cursor:pointer;}
button.btn{background:var(--gold);color:#20180A;border:none;padding:8px 16px;border-radius:4px;font-weight:600;font-size:13px;}
button.btn.secondary{background:transparent;color:var(--text-dim);border:1px solid var(--line);}
button.btn-del{background:none;border:none;color:var(--rust);font-size:12px;}
button.btn-edit{background:none;border:none;color:var(--gold);font-size:12px;margin-right:6px;}
.helptext{font-size:12px;color:var(--text-dim);line-height:1.5;margin-bottom:14px;}
.charts-row{display:flex;gap:20px;flex-wrap:wrap;}
.chart-box{flex:1;min-width:260px;height:260px;}
.empty{color:var(--text-dim);font-size:13px;padding:20px 0;text-align:center;}
.scenario-tag{font-size:10px;padding:1px 7px;border-radius:10px;margin-left:6px;}
.scenario-both{background:var(--panel);color:var(--text-dim);border:1px solid var(--line);}
.scenario-arb{background:rgba(201,166,93,.15);color:var(--gold);border:1px solid var(--gold);}
.perf-link{background:none;border:none;padding:0;font:inherit;font-family:'IBM Plex Mono',monospace;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;color:inherit;}
.perf-link:hover{color:var(--gold);}
.brand-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.save-status{font-size:11px;letter-spacing:0;text-transform:none;color:var(--text-dim);font-family:'Inter',sans-serif;}
.header-actions{display:flex;gap:6px;}
.header-actions .btn{padding:5px 10px;font-size:11px;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;}

@media (max-width: 720px){
  header.top{display:none !important;}
  .ledger-row{gap:18px;row-gap:8px;}
  .ledger-item .value{font-size:19px;}
  .ledger-item.net .value{font-size:23px;}
  nav.tabs{display:none;}
  .bottom-tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:40;padding:4px 2px calc(4px + env(safe-area-inset-bottom));}
  .bottom-tab-btn{flex:1;background:none;border:none;color:var(--text-dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;font-family:'Inter',sans-serif;cursor:pointer;}
  .bottom-tab-btn .bt-icon{width:22px;height:22px;display:block;}
  .bottom-tab-btn .bt-icon svg{width:100%;height:100%;}
  .bottom-tab-btn .bt-label{font-size:10px;font-weight:500;}
  .bottom-tab-btn.active{color:var(--gold);}
  .mobile-summary{display:block !important;margin-top:4px;}
  .dashboard-table{display:none;}
  .dashboard-cards{display:block;}
  main{padding:16px 12px calc(84px + env(safe-area-inset-bottom));}
  .grid2{grid-template-columns:1fr;gap:14px;}
  .card{padding:14px 14px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .card table{min-width:600px;}
  form.inline-form{padding:12px;gap:8px;}
  form.inline-form .field{flex:1 1 100%;}
  /* 16px minimum : sous ce seuil iOS Safari zoome automatiquement au focus, ce qui décale l'écran */
  input,select,textarea{font-size:16px;width:100%;min-width:0;box-sizing:border-box;}
  form.inline-form button.btn{width:100%;}
  table{font-size:12px;}
  th,td{padding:7px 6px;}
  .charts-row{flex-direction:column;}
  .chart-box{min-width:0;}
  #modalOverlay{align-items:flex-end;}
  #modalContent{padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:100%;border-radius:16px 16px 0 0;max-height:82vh;}
}
</style>


</head>
<body>

<div id="gateScreen"></div>

<header class="top">
  <div class="brand-row">
    <div class="brand"><span class="brand-hero"><span class="z">Z</span>Patrimoine</span> <span id="saveStatus" class="save-status"></span></div>
    <span class="header-actions">
      <span id="dossierLabel" class="save-status" style="margin-right:6px"></span>
      <span id="driveStatus" class="save-status" style="margin-right:6px"></span>
      <button type="button" id="settingsMenuBtn" class="settings-btn" title="Menu"><span class="icon" data-icon="settings"></span> Menu</button>
      <button type="button" id="driveConnectBtn" style="display:none"></button>
      <button type="button" id="dossierSettingsBtn" style="display:none"></button>
      <button type="button" id="lockAppBtn" style="display:none"></button>
      <button type="button" id="switchDossierBtn" style="display:none"></button>
      <button type="button" id="exportBtn" style="display:none"></button>
      <button type="button" id="importBtn" style="display:none"></button>
      <button type="button" id="importCsvBtn" style="display:none"></button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </span>
  </div>
  <div class="ledger-row">
    <div class="ledger-item net"><div class="label">Patrimoine net</div><div class="value mono" id="hdrNet">—</div></div>
    <div class="ledger-item asset"><div class="label">Actifs</div><div class="value mono" id="hdrAssets">—</div></div>
    <div class="ledger-item debt"><div class="label">Dettes</div><div class="value mono" id="hdrDebts">—</div></div>
    <div class="ledger-item"><div class="label">Année de référence</div><div class="year-picker" id="yearPickerBox"></div></div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab-btn" data-tab="dashboard">Vue d'ensemble</button>
  <button class="tab-btn" data-tab="supports">Supports</button>
  <button class="tab-btn" data-tab="mouvements">Mouvements</button>
  <button class="tab-btn" data-tab="actions">Actions</button>
  <button class="tab-btn" data-tab="valorisations">Valorisations</button>
  <button class="tab-btn" data-tab="emprunts">Emprunts</button>
  <button class="tab-btn" data-tab="projections">Projections</button>
  <button class="tab-btn" data-tab="offres">Offres</button>
  <button class="tab-btn" data-tab="fiscalite">Fiscalité</button>
</nav>

<main id="main"></main>

<nav class="bottom-tabs" id="bottomTabs">
  <button class="tab-btn bottom-tab-btn" data-tab="dashboard"><span class="bt-icon" data-icon="dashboard"></span><span class="bt-label">Accueil</span></button>
  <button class="tab-btn bottom-tab-btn" data-tab="mouvements"><span class="bt-icon" data-icon="mouvements"></span><span class="bt-label">Mouvements</span></button>
  <button class="tab-btn bottom-tab-btn" data-tab="actions"><span class="bt-icon" data-icon="actions"></span><span class="bt-label">Actions</span></button>
  <button class="tab-btn bottom-tab-btn" data-tab="supports"><span class="bt-icon" data-icon="supports"></span><span class="bt-label">Supports</span></button>
  <button type="button" class="bottom-tab-btn" id="moreTabBtn"><span class="bt-icon" data-icon="more"></span><span class="bt-label">Plus</span></button>
</nav>

<div id="modalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center;">
  <div id="modalContent" style="background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;max-width:560px;width:90%;max-height:80vh;overflow:auto;"></div>
</div>

<script>
// ---------- STORAGE ----------
let state = null; // défini une fois un dossier ouvert (voir defaultState/openDossier/createDossier)
let editing = {}; // holds id being edited per entity
let loaded = false;
let lastSupportId = null; // pour préremplir le dernier support utilisé en saisie de mouvement
let mouvementsFilter = {supportId:'', since:'', until:''};
let dashboardYear = new Date().getFullYear();
let dashboardGroupByType = false;
let dashboardShowDetail = true;

function hasPlatformStorage(){ return !!(window.storage && window.storage.get && window.storage.set); }
function hasLocalStorage(){ try{ const k='__test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } }
async function storageGetRaw(key){
  if(hasPlatformStorage()){ const r = await window.storage.get(key, false); return r ? r.value : null; }
  if(hasLocalStorage()) return localStorage.getItem(key);
  return null;
}
async function storageSetRaw(key, value){
  if(hasPlatformStorage()) return await window.storage.set(key, value, false);
  if(hasLocalStorage()){ localStorage.setItem(key, value); return true; }
  return null;
}
async function storageDeleteRaw(key){
  if(hasPlatformStorage() && window.storage.delete){ try{ await window.storage.delete(key, false); }catch(e){} }
  else if(hasLocalStorage()){ localStorage.removeItem(key); }
}

// ---------- CHIFFREMENT (AES-GCM + clé dérivée par mot de passe via PBKDF2) ----------
function bytesToBase64(bytes){ let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s); }
function base64ToBytes(b64){ return Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); }
function randomSalt(){ return bytesToBase64(crypto.getRandomValues(new Uint8Array(16))); }
async function deriveKey(password, saltB64){
  const salt = base64ToBytes(saltB64);
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptJSON(obj, key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return {encrypted:true, iv: bytesToBase64(iv), data: bytesToBase64(new Uint8Array(ciphertext))};
}
async function decryptJSON(blob, key){
  const iv = base64ToBytes(blob.iv);
  const data = base64ToBytes(blob.data);
  const dec = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  return JSON.parse(new TextDecoder().decode(dec));
}

// ---------- DOSSIERS ----------
let dossierIndex = [];
let currentDossierId = null;
let appLock = { hasPassword: false, salt: null, check: null };
let masterKey = null; // CryptoKey en mémoire uniquement, jamais persisté
function defaultState(){
  return {
    supports: [], mouvements: [], valorisations: [], emprunts: [], remboursementsAnticipes: [], actions: [],
    types: ['Assurance-vie','PEA','Compte-titres','Livret/épargne','Immobilier','SCPI','PER','FIP','PEE','Crypto','Autre'],
    dispos: ['Liquide','Disponible (fiscalité dégressive)','Bloqué à échéance connue'],
    projection: { horizonAnnees: 10, hypotheses: {}, versementsRecurrents: [], remboursementsSimules: [], scenarios: [] }
  };
}
async function loadIndex(){
  try{
    const raw = await storageGetRaw('grandlivre-index');
    if(!raw){ dossierIndex = []; appLock = {hasPassword:false, salt:null, check:null}; return; }
    const parsed = JSON.parse(raw);
    if(Array.isArray(parsed)){
      // ancien format (un mot de passe par dossier) : migration vers un mot de passe unique.
      // les dossiers qui étaient protégés restent chiffrés avec leur ancienne clé jusqu'à ouverture (voir migrateLegacyDossier).
      dossierIndex = parsed.map(d=> d.hasPassword ? {id:d.id, nom:d.nom, createdAt:d.createdAt, legacy:{salt:d.salt}} : {id:d.id, nom:d.nom, createdAt:d.createdAt});
      appLock = {hasPassword:false, salt:null, check:null};
    } else {
      dossierIndex = parsed.dossiers || [];
      appLock = parsed.appLock || {hasPassword:false, salt:null, check:null};
    }
  }catch(e){ dossierIndex = []; appLock = {hasPassword:false, salt:null, check:null}; }
}
// ============================================================
// SYNCHRONISATION GOOGLE DRIVE
// Pour l'activer : crée un identifiant OAuth "Client Web" dans Google Cloud Console
// (API activée : Google Drive API) puis colle-le ci-dessous, à la place du texte REMPLACE_...
// Voir les instructions détaillées données dans la conversation.
// ============================================================
const GOOGLE_CLIENT_ID = '368618283931-m71k2t9rpa6uje5cmeqq3nhckc4vndfp.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
let googleAccessToken = null;
let driveTokenClient = null;
let driveFileId = null;
let driveSyncing = false;

function googleConfigured(){ return GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf('REMPLACE_PAR')!==0; }
function initGoogleAuth(){
  if(!window.google || !google.accounts || driveTokenClient) return;
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp)=>{
      if(resp.error){ console.error('Google auth error', resp); updateDriveStatusUI('· connexion Google refusée'); return; }
      googleAccessToken = resp.access_token;
      await onDriveConnected();
    }
  });
}
function connectDrive(){
  if(!googleConfigured()){ alert("La synchronisation Google Drive n'est pas encore configurée dans ce fichier : il manque le Client ID Google."); return; }
  if(!window.google || !google.accounts){ alert("Le service d'authentification Google n'est pas encore chargé — vérifie ta connexion internet et réessaie dans un instant."); return; }
  if(!driveTokenClient) initGoogleAuth();
  try{ localStorage.setItem('grandlivre-drive-optin','1'); }catch(e){}
  driveTokenClient.requestAccessToken({prompt: 'consent'});
}
// Tente de retrouver un accès sans réafficher la fenêtre de consentement (l'utilisateur l'a déjà accordé).
function trySilentDriveReconnect(){
  let optedIn = false;
  try{ optedIn = localStorage.getItem('grandlivre-drive-optin')==='1'; }catch(e){}
  if(!optedIn || !googleConfigured() || !window.google || !google.accounts) return;
  if(!driveTokenClient) initGoogleAuth();
  try{ driveTokenClient.requestAccessToken({prompt: ''}); }catch(e){ console.warn('Reconnexion Drive silencieuse impossible', e); }
}
function disconnectDrive(){
  if(googleAccessToken && window.google) google.accounts.oauth2.revoke(googleAccessToken, ()=>{});
  googleAccessToken = null; driveFileId = null;
  try{ localStorage.removeItem('grandlivre-drive-optin'); }catch(e){}
  updateDriveStatusUI();
}
async function forceSyncNow(){
  if(!googleAccessToken){ connectDrive(); return; }
  updateDriveStatusUI('· synchronisation…');
  drivePushPending = true;
  await drivePushFlush();
}
function updateDriveStatusUI(customMsg){
  const el = document.getElementById('driveStatus');
  const btn = document.getElementById('driveConnectBtn');
  if(el) el.textContent = customMsg || (googleAccessToken ? '· Drive connecté' : '');
  if(btn) btn.textContent = googleAccessToken ? 'Déconnecter Drive' : 'Connecter Google Drive';
}

async function driveFetch(url, options){
  options = options || {};
  options.headers = Object.assign({}, options.headers, {Authorization: 'Bearer '+googleAccessToken});
  const res = await fetch(url, options);
  if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error('Drive API '+res.status+' : '+t.slice(0,200)); }
  return res;
}
async function driveFindOrCreateFile(){
  if(driveFileId) return driveFileId;
  const q = encodeURIComponent("name='grand-livre-data.json' and trashed=false");
  const listRes = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
  const listJson = await listRes.json();
  if(listJson.files && listJson.files.length>0){ driveFileId = listJson.files[0].id; return driveFileId; }
  const createRes = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:'grand-livre-data.json', mimeType:'application/json'})
  });
  const createJson = await createRes.json();
  driveFileId = createJson.id;
  return driveFileId;
}
async function driveReadData(){
  const id = await driveFindOrCreateFile();
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
  const text = await res.text();
  if(!text) return null;
  try{ return JSON.parse(text); }catch(e){ return null; }
}
async function driveWriteData(obj){
  const id = await driveFindOrCreateFile();
  await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj)
  });
}
let drivePushPending = false;
let drivePushTimer = null;
// Regroupe les sauvegardes rapprochées, et ne perd jamais une sauvegarde survenue pendant un envoi en cours.
function drivePushAll(){
  if(!googleAccessToken) return;
  drivePushPending = true;
  updateDriveStatusUI('· synchronisation…');
  clearTimeout(drivePushTimer);
  drivePushTimer = setTimeout(drivePushFlush, 600);
}
async function drivePushFlush(){
  if(!googleAccessToken || driveSyncing || !drivePushPending) return;
  driveSyncing = true;
  drivePushPending = false;
  try{
    const dossiers = {};
    for(const meta of dossierIndex){
      const raw = await storageGetRaw('grandlivre-dossier-'+meta.id);
      if(raw) dossiers[meta.id] = raw;
    }
    await driveWriteData({index: {appLock, dossiers: dossierIndex}, dossiers});
    updateDriveStatusUI('· synchronisé '+new Date().toLocaleTimeString('fr-FR'));
  }catch(e){
    console.error('Erreur envoi Drive', e);
    if(/\b401\b/.test(e.message)){
      googleAccessToken = null;
      updateDriveStatusUI('· session Drive expirée, reconnecte-toi');
    } else {
      drivePushPending = true; // on retentera au prochain enregistrement
      updateDriveStatusUI('· échec de synchro : '+e.message);
    }
  }
  finally{
    driveSyncing = false;
    if(drivePushPending && googleAccessToken){ clearTimeout(drivePushTimer); drivePushTimer = setTimeout(drivePushFlush, 1500); }
  }
}
async function driveSyncPull(){
  const remote = await driveReadData();
  if(remote){
    const idx = remote.index || {};
    dossierIndex = Array.isArray(idx) ? idx : (idx.dossiers || []);
    appLock = Array.isArray(idx) ? {hasPassword:false, salt:null, check:null} : (idx.appLock || {hasPassword:false, salt:null, check:null});
    for(const id in (remote.dossiers||{})) await storageSetRaw('grandlivre-dossier-'+id, remote.dossiers[id]);
    await storageSetRaw('grandlivre-index', JSON.stringify({appLock, dossiers: dossierIndex}));
  }
}
async function onDriveConnected(){
  updateDriveStatusUI('· synchronisation…');
  try{
    await driveSyncPull();
    updateDriveStatusUI();
    if(document.getElementById('gateScreen').style.display!=='none') renderGate();
  }catch(e){ console.error('Erreur de synchronisation Drive', e); alert('Erreur de synchronisation avec Drive : '+e.message); }
}

async function persistCurrentDossier(){
  let payload;
  if(appLock.hasPassword && masterKey) payload = JSON.stringify(await encryptJSON(state, masterKey));
  else payload = JSON.stringify(state);
  const r = await storageSetRaw('grandlivre-dossier-'+currentDossierId, payload);
  if(googleAccessToken) drivePushAll();
  return r;
}

async function createDossier(nom){
  const id = uid()+uid();
  const meta = {id, nom, createdAt: new Date().toISOString()};
  dossierIndex.push(meta);
  await saveIndex();
  state = defaultState();
  currentDossierId = id;

async function openDossier(id){
  const meta = dossierIndex.find(d=>d.id===id);
  if(!meta) throw new Error('Dossier introuvable');
  if(meta.legacy) throw new Error('LEGACY_LOCKED');
  const raw = await storageGetRaw('grandlivre-dossier-'+id);
  if(!raw){ state = defaultState(); }
  else{
    const parsed = JSON.parse(raw);
    if(parsed.encrypted){
      if(!appLock.hasPassword || !masterKey) throw new Error('VERROUILLE');
      try{ state = Object.assign(defaultState(), await decryptJSON(parsed, masterKey)); }
      catch(e){ throw new Error('DECHIFFREMENT_ECHEC'); }
    } else { state = Object.assign(defaultState(), parsed); }
  }
  currentDossierId = id;
  enterApp();
}
// Dossier créé avant la migration vers le mot de passe unique : nécessite une seule fois son ancien
// mot de passe pour être déchiffré, puis il est ré-enregistré selon le nouveau schéma (clair ou mot de passe unique).
async function migrateLegacyDossier(meta, oldPassword){
  const raw = await storageGetRaw('grandlivre-dossier-'+meta.id);
  const parsed = raw ? JSON.parse(raw) : null;
  if(!parsed || !parsed.encrypted){ delete meta.legacy; await saveIndex(); throw new Error('Rien à migrer, dossier déjà en clair.'); }
  const oldKey = await deriveKey(oldPassword, meta.legacy.salt);
  let data;
  try{ data = await decryptJSON(parsed, oldKey); }
  catch(e){ throw new Error('MOT_DE_PASSE_INCORRECT'); }
  state = Object.assign(defaultState(), data);
  currentDossierId = meta.id;
  delete meta.legacy;
  await saveIndex();
  await persistCurrentDossier();
  enterApp();
}
async function reencryptAllDossiers(newKeyOrNull){
  const oldKey = masterKey;
  for(const meta of dossierIndex){
    if(meta.legacy) continue;
    const raw = await storageGetRaw('grandlivre-dossier-'+meta.id);
    if(!raw) continue;
    const parsed = JSON.parse(raw);
    let data;
    if(parsed.encrypted){
      if(!oldKey) continue;
      try{ data = await decryptJSON(parsed, oldKey); }catch(e){ console.error('Erreur de re-chiffrement pour', meta.nom, e); continue; }
    } else data = parsed;
    const newPayload = newKeyOrNull ? JSON.stringify(await encryptJSON(data, newKeyOrNull)) : JSON.stringify(data);
    await storageSetRaw('grandlivre-dossier-'+meta.id, newPayload);
    if(meta.id===currentDossierId) state = Object.assign(defaultState(), data);
  }
}

async function saveState(attempt){
  attempt = attempt || 1;
  const statusEl = document.getElementById('saveStatus');
  if(!currentDossierId) return;
  if(!hasPlatformStorage() && !hasLocalStorage()){ if(statusEl) statusEl.textContent = '· aucun stockage disponible : pense à Exporter'; return; }
  if(statusEl) statusEl.textContent = '· sauvegarde…';
  try{
    const r = await persistCurrentDossier();
    if(hasPlatformStorage()) statusEl && (statusEl.textContent = r ? '· enregistré '+new Date().toLocaleTimeString('fr-FR') : '· échec de sauvegarde (réponse vide)');
    else statusEl && (statusEl.textContent = '· enregistré localement '+new Date().toLocaleTimeString('fr-FR'));
  }catch(e){
    console.error('storage error', e);
    if(attempt<2){ setTimeout(()=>saveState(attempt+1), 1200); return; }
    if(statusEl) statusEl.innerHTML = '· échec de sauvegarde : '+e.message+' <button type="button" id="retrySaveBtn" style="background:none;border:1px solid var(--line);color:var(--gold);border-radius:3px;padding:0 6px;font-size:11px;cursor:pointer;margin-left:4px">Réessayer</button>';
    const rb = document.getElementById('retrySaveBtn'); if(rb) rb.onclick = ()=>saveState();
  }
}

// Réordonnancement par glisser-déposer : rowSelector cible les <tr data-drag-id="..."> d'un <table>.
function enableRowDragReorder(table, onReorder){
  if(!table) return;
  let dragEl = null;
  const rows = ()=> Array.from(table.querySelectorAll('tr[data-drag-id]'));
  rows().forEach(row=>{
    row.draggable = true;
    row.addEventListener('dragstart', ()=>{ dragEl=row; setTimeout(()=>row.classList.add('dragging'),0); });
    row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); onReorder(rows().map(r=>r.dataset.dragId)); });
  });
  table.addEventListener('dragover', e=>{
    e.preventDefault();
    if(!dragEl) return;
    const after = rows().filter(r=>r!==dragEl).reduce((closest, child)=>{
      const box = child.getBoundingClientRect();
      const offset = e.clientY - box.top - box.height/2;
      if(offset<0 && offset>closest.offset) return {offset, element: child};
      return closest;
    }, {offset:-Infinity, element:null}).element;
    const tbody = table.querySelector('tbody') || table;
    if(after==null) tbody.appendChild(dragEl); else tbody.insertBefore(dragEl, after);
  });
}

function effectiveDispoDate(s){
  if(s.dispoMode==='date') return s.dateDisponibilite || null;
  if(s.dispoMode==='duree' && s.dispoDureeAnnees){
    const dates = state.mouvements.filter(m=>m.supportId===s.id).map(m=>m.date)
      .concat(state.valorisations.filter(v=>v.supportId===s.id).map(v=>v.date)).sort();
    const base = dates[0];
    if(!base) return null;
    const d = new Date(base); d.setFullYear(d.getFullYear()+Number(s.dispoDureeAnnees));
    return d.toISOString().slice(0,10);
  }
  return null;
}

function attachDateMasks(root){
  (root||document).querySelectorAll('input.date-mask').forEach(inp=>{
    if(inp.dataset.maskReady) return;
    inp.dataset.maskReady = '1';
    inp.addEventListener('input', ()=>{
      const atEnd = inp.selectionStart===inp.value.length;
      const digits = inp.value.replace(/\D/g,'').slice(0,8);
      let out = digits;
      if(digits.length>4) out = digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);
      else if(digits.length>2) out = digits.slice(0,2)+'/'+digits.slice(2);
      if(out!==inp.value){ inp.value = out; if(atEnd) inp.setSelectionRange(out.length, out.length); }
    });
    // Si on quitte le champ avec une année à 2 chiffres (ex: 15/03/24), on la complète en 20XX.
    inp.addEventListener('blur', ()=>{
      const m = inp.value.match(/^(\d{2})\/(\d{2})\/(\d{2})$/);
      if(m) inp.value = `${m[1]}/${m[2]}/20${m[3]}`;
    });
  });
}
function frToIso(fr){
  const s = (fr||'').trim();
  let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2]}-${m[1]}`;

  m = s.match(/^(\d{2})\/(\d{2})\/(\d{2})$/);
  if(m) return `20${m[3]}-${m[2]}-${m[1]}`;
  return null;
}

// ---------- XIRR ----------
function xirr(flows){
  // flows: [{date, amount}]
  if(flows.length<2) return null;
  const d0 = new Date(flows[0].date);
  const years = flows.map(f=> daysBetween(d0,f.date)/365);
  const npv = r => flows.reduce((s,f,i)=> s + f.amount/Math.pow(1+r,years[i]), 0);
  const dnpv = r => flows.reduce((s,f,i)=> s - years[i]*f.amount/Math.pow(1+r,years[i]+1), 0);
  let r = 0.1;
  for(let i=0;i<80;i++){
    const f=npv(r), d=dnpv(r);
    if(Math.abs(d)<1e-9) break;
    const nr = r - f/d;
    if(!isFinite(nr)) break;
    if(Math.abs(nr-r)<1e-7){ r=nr; break; }
    r=nr;
    if(r<-0.99) r=-0.99;
  }
  return isFinite(r) ? r : null;
}

function actionsValueForSupport(supportId){
  const acts = state.actions.filter(a=>a.supportId===supportId);
  if(acts.length===0) return null;
  return acts.reduce((s,a)=> s + a.quantite*a.coursActuel, 0);
}
function latestValorisation(supportId, beforeDate){
  const today = new Date().toISOString().slice(0,10);
  if(!beforeDate || beforeDate>=today){
    const av = actionsValueForSupport(supportId);
    if(av!==null) return {date: today, value: av, fromActions: true};
  }
  const list = state.valorisations.filter(v=>v.supportId===supportId && (!beforeDate || v.date<=beforeDate)).sort((a,b)=>a.date<b.date?1:-1);
  return list[0] || null;
}
// Valeur affichée : la vraie valorisation si elle existe, sinon une estimation basée sur le net des mouvements
// (utile tant qu'aucun relevé n'a encore été saisi, mais sans performance calculable dans ce cas).
function displayValue(supportId, untilDate){
  const val = latestValorisation(supportId, untilDate||null);
  if(val) return {value: val.value, estimated:false, fromActions: !!val.fromActions};
  const ms = state.mouvements.filter(m=>m.supportId===supportId && (!untilDate || effectiveDate(m)<=untilDate));
  if(ms.length===0) return null;
  const net = ms.reduce((s,m)=> s + (m.type==='retrait'? -m.montant : m.montant), 0); // versement et intérêts perçus augmentent la valeur estimée
  return {value: net, estimated:true};
}
function firstValorisationAfter(supportId, date){
  const list = state.valorisations.filter(v=>v.supportId===supportId && v.date>=date).sort((a,b)=>a.date<b.date?-1:1);
  return list[0] || null;
}

// Un mouvement d'intérêts perçus est rattaché économiquement à l'année de rattachement
// (même si le paiement effectif a lieu en N+1) : on utilise le 31/12 de cette année comme date de flux.
function effectiveDate(m){
  return (m.type==='interet' && m.anneeRattachement) ? `${m.anneeRattachement}-12-31` : m.date;
}
function investorFlow(m){
  // montant est toujours saisi en valeur positive ; le sens dépend du type
  return m.type==='versement' ? -m.montant : m.montant; // retrait ou intérêt = argent perçu par l'investisseur
}
function interestReceived(supportId, year){
  return state.mouvements.filter(m=>m.supportId===supportId && m.type==='interet' && m.anneeRattachement===year).reduce((s,m)=>s+m.montant,0);
}
function terminalValueForSupport(supportId, untilDate){
  const realVal = latestValorisation(supportId, untilDate||null);
  if(realVal) return {date: realVal.date, value: realVal.value, label: 'Valorisation au '+fmtDate(realVal.date)};
  const fb = displayValue(supportId, untilDate);
  if(!fb) return null;
  const d = untilDate || new Date().toISOString().slice(0,10);
  return {date: d, value: fb.value, label: 'Valeur estimée (net des mouvements) au '+fmtDate(d)};
}
function startValueForSupport(supportId, sinceDate){
  const hasReal = state.valorisations.some(v=>v.supportId===supportId);
  const startReal = latestValorisation(supportId, sinceDate);
  if(startReal && startReal.date < sinceDate) return {value: startReal.value, label: 'Valeur de départ (valorisation du '+fmtDate(startReal.date)+')'};
  if(!hasReal){ const sf = displayValue(supportId, sinceDate); return {value: sf?sf.value:0, label: 'Valeur de départ estimée'}; }
  return null;
}
function computeXIRRDetail(supportId, sinceDate, untilDate){
  return groupXIRRDetail([supportId], sinceDate, untilDate);
}
// Calcule un XIRR agrégé sur un ensemble de supports (portefeuille entier ou un groupe/type donné)
function groupXIRRDetail(supportIds, sinceDate, untilDate){
  let flows = [];
  let startTotal = 0, hasStart = false;
  let terminalTotal = 0;
  const multi = supportIds.length>1;
  supportIds.forEach(id=>{
    const sup = state.supports.find(s=>s.id===id);
    const suffix = multi && sup ? ' — '+sup.nom : '';
    if(sinceDate){
      const sv = startValueForSupport(id, sinceDate);
      if(sv){ startTotal += sv.value; hasStart = true; }
    }
    const hasRealVal = state.valorisations.some(v=>v.supportId===id);
    state.mouvements.filter(m=>{
      if(m.supportId!==id) return false;
      if(!hasRealVal && m.type==='interet') return false;
      const ed = effectiveDate(m);
      if(sinceDate && ed<sinceDate) return false;
      if(untilDate && ed>untilDate) return false;
      return true;
    }).forEach(m=>{
      const lbl = (m.type==='versement' ? 'Versement' : m.type==='retrait' ? 'Retrait' : `Intérêts perçus (rattachés ${m.anneeRattachement})`)+suffix;
      flows.push({date: effectiveDate(m), amount: investorFlow(m), label: lbl});
    });
    const tv = terminalValueForSupport(id, untilDate);
    if(tv) terminalTotal += tv.value;
  });
  if(sinceDate && hasStart) flows.push({date: sinceDate, amount: -startTotal, label: 'Valeur de départ'+(multi?' (ensemble)':'')});
  if(flows.length===0) return {flows:[], rate:null};
  const terminalDate = untilDate || new Date().toISOString().slice(0,10);
  flows.push({date: terminalDate, amount: terminalTotal, label: 'Valeur au '+fmtDate(terminalDate)+(multi?' (ensemble)':'')});
  flows.sort((a,b)=>a.date<b.date?-1:1);
  const nonZero = flows.filter(f=>f.amount!==0);
  const rate = (nonZero.length<2 || nonZero.every(f=>f.amount<0) || nonZero.every(f=>f.amount>0)) ? null : xirr(flows);
  return {flows, rate};
}
function supportXIRR(supportId, sinceDate, untilDate){
  return computeXIRRDetail(supportId, sinceDate, untilDate).rate;
}

// ---------- EMPRUNTS / AMORTISSEMENT ----------
function loanSchedule(emprunt){
  const rate = emprunt.taux/100/12;
  const n = emprunt.duree;
  let capital = emprunt.capital;
  let mensualite = emprunt.type==='constant' ? (rate===0? capital/n : capital*rate/(1-Math.pow(1+rate,-n))) : capital*rate;
  const prepays = state.remboursementsAnticipes.filter(r=>r.empruntId===emprunt.id);
  const schedule = [];
  let date = new Date(emprunt.dateDebut);
  for(let m=1; m<=n && capital>0.5; m++){
    date = addMonths(emprunt.dateDebut, m);
    const iso = date.toISOString().slice(0,10);
    const interet = capital*rate;
    let principal = emprunt.type==='constant' ? (mensualite-interet) : 0;
    if(emprunt.type==='infine' && m===n) principal = capital;
    const monthPrepays = prepays.filter(p=> p.date.slice(0,7)===iso.slice(0,7));
    const prepaySum = monthPrepays.reduce((s,p)=>s+p.montant,0);
    capital = Math.max(0, capital - principal - prepaySum);
    // si l'un des remboursements de ce mois demande une réduction de mensualité, on la recalcule sur la durée restante
    if(emprunt.type==='constant' && prepaySum>0 && monthPrepays.some(p=>p.mode==='mensualite') && capital>0){
      const remaining = n-m;
      if(remaining>0) mensualite = rate===0? capital/remaining : capital*rate/(1-Math.pow(1+rate,-remaining));
    }
    schedule.push({date: iso, capitalRestant: capital, interet, principal: principal+prepaySum, mensualite});
  }
  return schedule;
}
// Mensualité réellement en cours aujourd'hui (tient compte des remboursements anticipés passés avec réduction de mensualité) —
// à ne pas confondre avec loanMensualiteInitiale(e), qui est la mensualité d'origine, fixe, utilisée comme référence.
function loanCurrentMensualite(emprunt){
  const sched = loanSchedule(emprunt);
  const today = new Date().toISOString().slice(0,10);
  let m = loanMensualiteInitiale(emprunt);
  for(const s of sched){ if(s.date<=today) m = s.mensualite; else break; }
  return m;
}
function loanRemainingToday(emprunt){
  const sched = loanSchedule(emprunt);
  const today = new Date().toISOString().slice(0,10);
  let last = emprunt.capital;
  for(const s of sched){ if(s.date<=today) last = s.capitalRestant; else break; }
  return last;
}
function loanMensualiteInitiale(emprunt){
  const rate = emprunt.taux/100/12, n = emprunt.duree;
  return emprunt.type==='constant' ? (rate===0? emprunt.capital/n : emprunt.capital*rate/(1-Math.pow(1+rate,-n))) : emprunt.capital*rate;
}
function loanInsuranceMonthly(emprunt){
  if(!emprunt.assuranceValeur) return 0;
  return emprunt.assuranceType==='montant' ? emprunt.assuranceValeur : emprunt.capital*(emprunt.assuranceValeur/100)/12;
}
function loanInterestSummary(emprunt){
  const sched = loanSchedule(emprunt);
  const today = new Date().toISOString().slice(0,10);
  const assuranceMensuelle = loanInsuranceMonthly(emprunt);
  let interetsPayes=0, interetsRestants=0, assurancePayee=0, assuranceRestante=0;
  sched.forEach(s=>{
    if(s.date<=today){ interetsPayes+=s.interet; assurancePayee+=assuranceMensuelle; }
    else{ interetsRestants+=s.interet; assuranceRestante+=assuranceMensuelle; }
  });
  return {interetsPayes, interetsRestants, assurancePayee, assuranceRestante};
}

const CHART_PALETTE = ['#4F9C82','#C9A65D','#B5563C','#6E8FA8','#8B7EC8','#A9A599','#376E5C','#D6B36A'];
function svgDonut(data, size){
  size = size || 170;
  const strokeWidth = size*0.16;
  const entries = Object.entries(data).filter(([,v])=>v>0);
  const total = entries.reduce((s,[,v])=>s+v,0);
  if(total<=0) return '<div class="empty">Pas encore de valeur à répartir.</div>';
  const r = (size-strokeWidth)/2;
  const c = 2*Math.PI*r;
  let offset = 0;
  const segments = entries.map(([k,v],i)=>{
    const dash = (v/total)*c;
    const seg = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${CHART_PALETTE[i%CHART_PALETTE.length]}" stroke-width="${strokeWidth}" stroke-dasharray="${dash} ${c-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
    offset += dash;
    return seg;
  }).join('');
  const legend = entries.map(([k,v],i)=>`<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);margin-top:5px"><span style="width:9px;height:9px;border-radius:2px;background:${CHART_PALETTE[i%CHART_PALETTE.length]};display:inline-block;flex-shrink:0"></span>${k} — ${fmtEUR(v)} <span class="mono" style="color:var(--text)">(${(v/total*100).toFixed(1)}%)</span></div>`).join('');
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segments}</svg>
    <div>${legend}</div>
  </div>`;
}
function svgLineChart(seriesList, opts){
  opts = opts || {};
  const width = opts.width||720, height = opts.height||280;
  const uid = 'chart'+Math.random().toString(36).slice(2,9);
  const n = seriesList[0].points.length;
  const allY = seriesList.flatMap(s=>s.points.map(p=>p.y));
  let minY = Math.min(0, ...allY), maxY = Math.max(...allY);
  if(minY===maxY){ minY-=1; maxY+=1; }
  const gridVals = [0,0.25,0.5,0.75,1].map(f=> minY + f*(maxY-minY));
  // padding gauche calculé sur la largeur réelle des libellés (sinon les premiers chiffres sont hors du cadre SVG)
  const maxLabelLen = Math.max(...gridVals.map(v=>fmtEUR(v).length));
  const paddingLeft = Math.max(50, 16 + maxLabelLen*6.4);
  const paddingRight = 16, paddingTop = 16, paddingBottom = 30;
  const xFor = i => paddingLeft + (n<=1?0:(i/(n-1))*(width-paddingLeft-paddingRight));
  const yFor = v => height-paddingBottom - ((v-minY)/(maxY-minY))*(height-paddingTop-paddingBottom);
  const gridLines = gridVals.map(v=>{
    const y = yFor(v);
    return `<line x1="${paddingLeft}" y1="${y}" x2="${width-paddingRight}" y2="${y}" stroke="#2C333C" stroke-width="1"/><text x="${paddingLeft-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#9AA0A8">${fmtEUR(v)}</text>`;
  }).join('');
  const step = Math.max(1, Math.round(n/6));
  const xLabels = seriesList[0].points.map((p,i)=> i%step===0 ? `<text x="${xFor(i)}" y="${height-paddingBottom+16}" text-anchor="middle" font-size="10" fill="#9AA0A8">${p.label}</text>` : '').join('');
  const lines = seriesList.map(s=>{
    const d = s.points.map((p,i)=> (i===0?'M':'L')+xFor(i).toFixed(1)+','+yFor(p.y).toFixed(1)).join(' ');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;
  }).join('');
  const legend = seriesList.map(s=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);margin-right:16px"><span style="width:16px;height:2.5px;background:${s.color};display:inline-block"></span>${s.label}</span>`).join('');
  const html = `<div>${legend}</div>
    <div style="position:relative;margin-top:6px">
      <svg id="${uid}" width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="touch-action:pan-y;cursor:crosshair;display:block">
        ${gridLines}${lines}
        <g id="${uid}-cross" style="display:none">
          <line x1="0" y1="${paddingTop}" x2="0" y2="${height-paddingBottom}" stroke="#C9A65D" stroke-width="1" stroke-dasharray="3,3"/>
          ${seriesList.map((s,si)=>`<circle id="${uid}-dot${si}" r="3.5" fill="${s.color}" stroke="#12161A" stroke-width="1.5"/>`).join('')}
        </g>
        ${xLabels}
      </svg>
      <div id="${uid}-tip" style="display:none;position:absolute;pointer-events:none;background:#20262E;border:1px solid #2C333C;border-radius:6px;padding:6px 10px;font-size:11px;color:#EDEAE1;white-space:nowrap;transform:translate(-50%,-115%);z-index:5"></div>
    </div>
    <div class="sub" style="margin-top:6px">Touche ou survole le graphique pour lire le montant à une date précise.</div>`;
  function activate(){
    const svg = document.getElementById(uid);
    if(!svg) return;
    const cross = document.getElementById(uid+'-cross');
    const tip = document.getElementById(uid+'-tip');
    const dots = seriesList.map((s,si)=>document.getElementById(uid+'-dot'+si));
    function showAt(clientX){
      const rect = svg.getBoundingClientRect();
      if(!rect.width) return;
      const localX = (clientX-rect.left)*(width/rect.width);
      let idx = Math.round(((localX-paddingLeft)/(width-paddingLeft-paddingRight))*(n-1));
      idx = Math.max(0, Math.min(n-1, idx));
      const x = xFor(idx);
      cross.setAttribute('transform', `translate(${x},0)`);
      cross.style.display = '';
      const lines = [`<div style="color:#9AA0A8;margin-bottom:3px">${seriesList[0].points[idx].label}</div>`];
      seriesList.forEach((s,si)=>{
        const p = s.points[idx];
        dots[si].setAttribute('cx', x); dots[si].setAttribute('cy', yFor(p.y));
        lines.push(`<div><span style="color:${s.color}">●</span> ${s.label} : ${fmtEUR(p.y)}</div>`);
      });
      tip.innerHTML = lines.join('');
      tip.style.display = 'block';
      tip.style.left = (x/width*100)+'%';
      tip.style.top = Math.max(paddingTop, Math.min(...seriesList.map(s=>yFor(s.points[idx].y))))+'px';
    }
    function hide(){ cross.style.display='none'; tip.style.display='none'; }
    svg.addEventListener('mousemove', e=>showAt(e.clientX));
    svg.addEventListener('mouseleave', hide);
    svg.addEventListener('touchstart', e=>showAt(e.touches[0].clientX), {passive:true});
    svg.addEventListener('touchmove', e=>showAt(e.touches[0].clientX), {passive:true});
    svg.addEventListener('touchend', hide);
  }
  return {html, activate};
}

// ---------- IMPORT CSV PARAMÉTRABLE ----------
function parseCSV(text){
  const firstLine = text.split(/\r?\n/)[0]||'';
  const delim = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
  const allRows = lines.map(l=> l.split(delim).map(c=>c.trim().replace(/^"|"$/g,'')));
  return {delim, allRows};
}
function guessColumn(headers, keywords){
  const idx = headers.findIndex(h=> keywords.some(k=>(h||'').toLowerCase().includes(k)));
  return idx>=0 ? idx : 0;
}
function csvParseDate(raw, format){
  raw = (raw||'').trim();
  if(format==='iso') return /^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw : null;
  const m = raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(!m) return null;
  let [,d,mo,y] = m;
  if(y.length===2) y = '20'+y;
  return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
}
function csvParseAmount(raw){
  if(raw===undefined || raw===null) return NaN;
  let s = String(raw).replace(/\s/g,'').replace(/[€$]/g,'');
  if(s.includes(',') && s.lastIndexOf(',')>s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',','.');
  else s = s.replace(/,/g,'');
  return parseFloat(s);
}

function showCsvPreview(){
  const form = document.getElementById('csvMapForm');
  const fd = new FormData(form);
  const entity = fd.get('entity'), supportId = fd.get('supportId'), dateFormat = fd.get('dateFormat');
  const colDate = Number(fd.get('colDate')), colMontant = Number(fd.get('colMontant')), colType = fd.get('colType');
  const { rows } = currentCsvColumns();
  const parsed = []; let skipped = 0;
  rows.forEach(r=>{
    const iso = csvParseDate(r[colDate], dateFormat);
    const amt = csvParseAmount(r[colMontant]);

      parsed.push({date:iso, type, montant:Math.abs(amt)});
    } else parsed.push({date:iso, value:amt});
  });

// ---- ÉVOLUTION DU PATRIMOINE (historique réel, distinct des projections) ----
function patrimoineHistory(){
  let minDate = null;
  state.valorisations.forEach(v=>{ if(!minDate || v.date<minDate) minDate=v.date; });
  state.mouvements.forEach(m=>{ const d=effectiveDate(m); if(!minDate || d<minDate) minDate=d; });
  state.emprunts.forEach(e=>{ if(!minDate || e.dateDebut<minDate) minDate=e.dateDebut; });
  if(!minDate) return [];
  const start = new Date(minDate); start.setDate(1);
  const todayISO = new Date().toISOString().slice(0,10);
  const points = [];
  let cursor = new Date(start);
  let guard = 0;
  while(cursor.toISOString().slice(0,10)<=todayISO && guard<480){
    guard++;
    const monthEndRaw = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).toISOString().slice(0,10);
    const capDate = monthEndRaw>todayISO ? todayISO : monthEndRaw;
    let assets = 0;
    state.supports.forEach(s=>{ const v=displayValue(s.id, capDate); if(v) assets+=v.value; });
    let debts = 0;
    state.emprunts.forEach(e=>{
      if(e.dateDebut>capDate) return;
      const sched = loanSchedule(e);
      let last = e.capital;
      for(const sp of sched){ if(sp.date<=capDate) last=sp.capitalRestant; else break; }
      debts += last;
    });
    points.push({y: assets-debts, label: cursor.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'})});
    cursor.setMonth(cursor.getMonth()+1);
  }
  return points;
}
let evolutionChartActivate = null;
function renderEvolutionChart(){
  const points = patrimoineHistory();
  if(points.length<2) return "<div class=\"empty\">Ajoute au moins deux mois de données (valorisations, mouvements ou emprunts) pour voir l'évolution.</div>";
  const chart = svgLineChart([{label:'Patrimoine net', color:'#4F9C82', points}]);
  evolutionChartActivate = chart.activate;
  return chart.html;
}

        <div class="sc-perf-item"><span class="sc-label">Perf. globale</span>${gGlobal.rate===null?'<span class="pill">pas assez de données</span>':`<button class="perf-link" data-ids="${ids.join(',')}" data-since="" data-until="" data-title="Performance globale — ${t}">${fmtPct(gGlobal.rate)}</button>`}</div>
      </div>
    </div>`;
  }

  let tableBody, cardList;
  if(dashboardGroupByType){
    const typesPresent = Array.from(new Set(state.supports.map(s=>s.type)));
    tableBody = typesPresent.map(t=>{
      const ids = state.supports.filter(s=>s.type===t).map(s=>s.id);
      const val = ids.reduce((sum,id)=>{ const v=displayValue(id, untilDate); return sum+(v?v.value:0); },0);
      const gAnnuel = groupXIRRDetail(ids, sinceDate, untilDate);
      const gGlobal = groupXIRRDetail(ids, null, null);
      const groupRow = `<tr style="background:var(--panel-2)">
        <td class="label-cell" style="font-weight:600">${t}</td>
        <td class="label-cell">${ids.length} support${ids.length>1?'s':''}</td>
        <td></td>
        <td>${fmtEUR(val)}</td>
        <td class="${gAnnuel.rate>0?'pos':gAnnuel.rate<0?'neg':''}">${gAnnuel.rate===null?'<span class="pill">pas assez de données</span>':`<button class="perf-link" data-ids="${ids.join(',')}" data-since="${sinceDate}" data-until="${untilDate||''}" data-title="Performance ${dashboardYear} — ${t}">${fmtPct(gAnnuel.rate)}</button>`}</td>
        <td class="${gGlobal.rate>0?'pos':gGlobal.rate<0?'neg':''}">${gGlobal.rate===null?'<span class="pill">pas assez de données</span>':`<button class="perf-link" data-ids="${ids.join(',')}" data-since="" data-until="" data-title="Performance globale — ${t}">${fmtPct(gGlobal.rate)}</button>`}</td>
        <td></td>

      return groupRow + detailRows;
    }).join('');
    cardList = typesPresent.map(t=>{
      const ids = state.supports.filter(s=>s.type===t).map(s=>s.id);
      const details = dashboardShowDetail ? state.supports.filter(s=>s.type===t).map(s=>supportCard(s,true)).join('') : '';
      return groupCard(t, ids) + details;
    }).join('');
  } else {
    tableBody = state.supports.map(supportRow).join('');
    cardList = state.supports.map(s=>supportCard(s,false)).join('');
  }

  const byType = {}, byDispo = {};
  state.supports.forEach(s=>{ const v=displayValue(s.id,null); byType[s.type]=(byType[s.type]||0)+(v?v.value:0); byDispo[s.disponibilite]=(byDispo[s.disponibilite]||0)+(v?v.value:0); });

  const empRows = state.emprunts.map(e=>{
    const sum = loanInterestSummary(e);
    return `<tr><td class="label-cell">${e.nom}</td><td>${fmtEUR(loanRemainingToday(e))}</td><td class="neg">${fmtEUR(sum.interetsPayes)}</td><td>${fmtEUR(sum.interetsRestants)}</td><td>${fmtEUR(sum.assurancePayee+sum.assuranceRestante)}</td></tr>`;
  }).join('');
  const empCard = state.emprunts.length? `
  <div class="card">
    <h3>Emprunts</h3>
    <div class="sub">Intérêts et assurance, payés à ce jour et restant à courir sur l'échéancier</div>
    <table><thead><tr><th>Emprunt</th><th>Restant dû</th><th>Intérêts payés</th><th>Intérêts restants</th><th>Assurance totale</th></tr></thead><tbody>${empRows}</tbody></table>
  </div>` : '';

  const assetsNow = totalAssets(), debtsNow = totalDebts();
  return `
  <div class="card mobile-summary">
    <div class="label" style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim)">Patrimoine net</div>
    <div class="mono" style="font-size:30px;color:var(--gold);margin:2px 0 10px">${fmtEUR(assetsNow-debtsNow)}</div>
    <div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">
      <div><div class="label" style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim)">Actifs</div><div class="mono pos" style="font-size:15px">${fmtEUR(assetsNow)}</div></div>
      <div><div class="label" style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim)">Dettes</div><div class="mono neg" style="font-size:15px">${fmtEUR(debtsNow)}</div></div>
      <div><div class="label" style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim)">Année</div><div class="year-picker" id="yearPickerBoxMobile"></div></div>
    </div>
  </div>
  <div class="card">
    <h3>Performance du portefeuille</h3>
    <div class="sub">Tous les supports combinés, méthode XIRR</div>
    <div class="ledger-row" style="gap:32px">
      <div class="ledger-item"><div class="label">Performance ${dashboardYear}</div><div class="value mono" style="font-size:22px">${perfBtn(portAnnuel,'Performance '+dashboardYear+' — Portefeuille')}</div></div>
      <div class="ledger-item"><div class="label">Performance globale</div><div class="value mono" style="font-size:22px">${perfBtn(portGlobal,'Performance globale — Portefeuille')}</div></div>
    </div>
  </div>
  <div class="card">
    <h3>Évolution du patrimoine net</h3>
    <div class="sub">Historique réel, calculé à partir de tes valorisations, mouvements et emprunts enregistrés</div>
    ${renderEvolutionChart()}
  </div>
  <div class="grid2">
    <div class="card"><h3>Répartition par type</h3><div class="sub">Valeur actuelle par catégorie de support</div>${svgDonut(byType)}</div>
    <div class="card"><h3>Répartition par disponibilité</h3><div class="sub">Ce qui est mobilisable rapidement vs bloqué</div>${svgDonut(byDispo)}</div>
  </div>
  <div class="card">
    <h3>Comparatif des supports</h3>
    <div class="sub">Performance de l'année sélectionnée (${dashboardYear}, modifiable en haut de page) vs performance globale, méthode XIRR</div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:end;margin-bottom:14px">
      <div class="field"><label>&nbsp;</label><label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);text-transform:none;letter-spacing:0"><input type="checkbox" id="groupByTypeChk" ${dashboardGroupByType?'checked':''}> Regrouper par type</label></div>
      ${dashboardGroupByType? `<div class="field"><label>&nbsp;</label><label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);text-transform:none;letter-spacing:0"><input type="checkbox" id="groupDetailChk" ${dashboardShowDetail?'checked':''}> Avec détail</label></div>`:''}
    </div>
    <table class="dashboard-table"><thead><tr><th>Support</th><th>Type</th><th>Disponibilité</th><th>Valeur</th><th>Perf. ${dashboardYear}</th><th>Perf. globale</th><th>Contrôle SCPI</th></tr></thead>
    <tbody>${tableBody}</tbody></table>
    <div class="dashboard-cards">${cardList}</div>

}

      if(dispoRaw){ dateDisponibilite = frToIso(dispoRaw); if(!dateDisponibilite){ alert('Date de disponibilité invalide : utilise le format JJ/MM/AAAA.'); return; } }

      dispoDureeAnnees = fd.get('dispoDureeAnnees') ? Number(fd.get('dispoDureeAnnees')) : null;

    const obj = {nom:fd.get('nom'), type:fd.get('type'), disponibilite:fd.get('disponibilite'), dispoMode, dateDisponibilite, dispoDureeAnnees, delaiJouissance:Number(fd.get('delaiJouissance')||0)};

    saveState(); closeModal(); renderTab('supports');
  };

// ---- ACTIONS ----
// Récupération du dernier cours : service tiers gratuit (Stooq), sans garantie de disponibilité ni de couverture
// de tous les marchés — le ticker doit inclure le suffixe de place (ex. AAPL.US, MC.FR).
async function fetchStockPrice(ticker){
  const url = `https://stooq.com/q/l/?s=${encodeURIComponent(ticker.trim())}&f=sd2t2ohlcv&h&e=csv`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Service indisponible');
  const text = await res.text();
  const lines = text.trim().split('\n');
  if(lines.length<2) throw new Error('Réponse vide');
  const cols = lines[1].split(',');
  const close = parseFloat(cols[6]);
  if(!close || isNaN(close)) throw new Error('Ticker non reconnu');
  return close;
}
async function refreshActionPrice(id){
  const a = state.actions.find(x=>x.id===id);
  if(!a || !a.ticker){ alert("Renseigne un ticker pour cette ligne avant de rafraîchir (ex. AAPL.US, MC.FR)."); return; }
  try{ a.coursActuel = await fetchStockPrice(a.ticker); saveState(); renderTab('actions'); }
  catch(err){ alert(`Impossible de récupérer le cours pour "${a.ticker}" : ${err.message}. Vérifie le format du ticker ou mets à jour manuellement.`); }
}
async function refreshAllActionPrices(){
  const withTicker = state.actions.filter(a=>a.ticker);
  if(withTicker.length===0){ alert('Aucune ligne avec un ticker renseigné.'); return; }
  let ok=0, fail=0;
  for(const a of withTicker){
    try{ a.coursActuel = await fetchStockPrice(a.ticker); ok++; }catch(e){ fail++; }
  }
  saveState(); renderTab('actions');
  alert(`${ok} cours mis à jour${fail? `, ${fail} échec(s) (ticker non reconnu ou service indisponible)`:''}.`);
}

function viewActions(){
  if(state.supports.length===0) return `<div class="card"><div class="empty">Ajoute d'abord un support (PEA, compte-titres…) pour pouvoir y rattacher des actions.</div></div>`;
  const rows = state.actions.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).map(a=>{
    const sup = state.supports.find(s=>s.id===a.supportId);
    const valeurActuelle = a.quantite*a.coursActuel;
    const valeurRevient = a.quantite*a.pru;
    const plusValue = valeurActuelle - valeurRevient;
    const plusValuePct = valeurRevient ? plusValue/valeurRevient : null;
    const progression = a.coursCible ? Math.min(1, a.coursActuel/a.coursCible) : null;
    const progressBar = a.coursCible ? `
      <div style="background:var(--panel);border-radius:20px;height:6px;width:100%;overflow:hidden;margin-top:4px">
        <div style="background:${progression>=1?'var(--gold)':'var(--teal)'};height:100%;width:${(progression*100).toFixed(0)}%"></div>
      </div>
      <div style="font-size:10px;color:var(--text-dim);margin-top:2px">${(progression*100).toFixed(0)}% de l'objectif${progression>=1?' — atteint':''}</div>` : '';
    return `<tr>
      <td class="label-cell">${a.nom}${a.ticker?` <span class="pill">${a.ticker}</span>`:''}</td>
      <td class="label-cell">${sup?sup.nom:'?'}</td>
      <td>${a.quantite}</td>
      <td>${fmtEUR(a.pru)}</td>
      <td>${fmtEUR(a.coursActuel)}${a.ticker?` <button type="button" class="icon-btn" data-refresh-action="${a.id}" title="Rafraîchir le cours">${ICONS.sync}</button>`:''}</td>
      <td>${fmtEUR(valeurActuelle)}</td>
      <td class="${plusValue>0?'pos':plusValue<0?'neg':''}">${fmtEUR(plusValue)}${plusValuePct!==null?` (${fmtPct(plusValuePct)})`:''}</td>
      <td style="min-width:120px">${a.coursCible? `${fmtEUR(a.coursCible)}${progressBar}` : '—'}</td>
      <td>${editBtn('edit-action', a.id)}${delBtn('del-action', a.id)}</td>

  }).join('');
  return `

  </div>`;
}

    <td><input data-hyp="${s.id}" type="number" inputmode="decimal" step="0.1" style="width:80px" value="${state.projection.hypotheses[s.id]!==undefined?state.projection.hypotheses[s.id]:3}"> %/an</td>

function projectPatrimoine(scenarioId){
  const months = state.projection.horizonAnnees*12;
  const today = new Date();
  // support values
  let supVals = {};
  state.supports.forEach(s=>{ const v = displayValue(s.id,null); supVals[s.id]=v?v.value:0; });
  // loan capitals (start from today's remaining) et mensualité réellement en cours aujourd'hui (pas la mensualité d'origine,
  // qui peut avoir été réduite par un remboursement anticipé passé avec effet "mensualité")
  let loanCap = {}, curMensualite = {};
  state.emprunts.forEach(e=>{ loanCap[e.id]=loanRemainingToday(e); curMensualite[e.id]=loanCurrentMensualite(e); });
  const points = [];
  let totalInterets = 0, totalAssurance = 0;
  for(let m=0;m<=months;m++){
    const date = new Date(today); date.setMonth(date.getMonth()+m);
    const iso = date.toISOString().slice(0,10);
    if(m>0){
      // grow supports + recurring contributions
      state.supports.forEach(s=>{
        const rate = (state.projection.hypotheses[s.id]!==undefined?state.projection.hypotheses[s.id]:3)/100/12;
        supVals[s.id] = supVals[s.id]*(1+rate);
        state.projection.versementsRecurrents.filter(v=>v.supportId===s.id && (v.scenarioId===null || (scenarioId!==null && v.scenarioId===scenarioId)) && (!v.dateFin || v.dateFin>=iso)).forEach(v=>{
          supVals[s.id]+=v.montant;
        });
      });
      // amortize loans (capital, intérêts, assurance) et réaffectation du capital libéré
      state.emprunts.forEach(e=>{
        const rate = e.taux/100/12;
        const mensualiteInitiale = loanMensualiteInitiale(e);
        let interet = 0, principal = 0, prepay = 0;
        const applicable = state.projection.remboursementsSimules.filter(r=>r.empruntId===e.id && r.date.slice(0,7)===iso.slice(0,7) && (r.scenarioId===null || (scenarioId!==null && r.scenarioId===scenarioId)));
        if(loanCap[e.id]>0.5){
          interet = loanCap[e.id]*rate;
          principal = e.type==='constant' ? (curMensualite[e.id]-interet) : 0;
          if(e.type==='infine' && loanCap[e.id]-Math.max(0,applicable.reduce((s,r)=>s+r.montant,0))<=0.5) principal = loanCap[e.id];
          prepay = applicable.reduce((s,r)=>s+r.montant,0);
          loanCap[e.id] = Math.max(0, loanCap[e.id]-principal-prepay);
          totalInterets += interet;
          totalAssurance += loanInsuranceMonthly(e);
          // le remboursement anticipé simulé peut être financé par un retrait sur un placement, à la même date
          applicable.forEach(r=>{ if(r.sourceSupportId && supVals[r.sourceSupportId]!==undefined) supVals[r.sourceSupportId] = Math.max(0, supVals[r.sourceSupportId]-r.montant); });
          // si l'effet demandé est "réduire la mensualité", on recalcule la mensualité en cours sur la durée restante
          if(e.type==='constant' && prepay>0 && applicable.some(r=>r.mode==='mensualite') && loanCap[e.id]>0){
            const moisEcoules = Math.round((date-new Date(e.dateDebut))/(30.44*86400000));
            const remaining = Math.max(1, e.duree-moisEcoules);
            curMensualite[e.id] = rate===0 ? loanCap[e.id]/remaining : loanCap[e.id]*rate/(1-Math.pow(1+rate,-remaining));
          }
        }
        // capital libéré ce mois-ci (mensualité d'origine non dépensée, prêt soldé ou mensualité réduite) : réaffecté si une destination est définie
        const paiementReel = principal + interet;
        const libere = Math.max(0, mensualiteInitiale - paiementReel);
        if(e.supportReaffectation && libere>0 && supVals[e.supportReaffectation]!==undefined){
          supVals[e.supportReaffectation] += libere;
        }
      });
    }
    const assets = Object.values(supVals).reduce((a,b)=>a+b,0);
    const debts = Object.values(loanCap).reduce((a,b)=>a+b,0);
    points.push({date: iso, net: assets-debts});
  }
  return {points, totalInterets, totalAssurance};
}
let projectionChartActivate = null;
function renderProjectionChart(){
  if(state.supports.length===0 && state.emprunts.length===0) return '<div class="empty">Ajoute des supports ou des emprunts pour voir la projection.</div>';
  const sample = pts => pts.filter((_,i)=>i%3===0).map(p=>({y:Math.round(p.net), label:p.date.slice(0,7)}));
  const base = projectPatrimoine(null);
  const series = [{label:'Scénario de base', color:'#4F9C82', points: sample(base.points)}];
  const costLines = [`Sur l'horizon — Base : ${fmtEUR(base.totalInterets)} d'intérêts et ${fmtEUR(base.totalAssurance)} d'assurance emprunt`];
  (state.projection.scenarios||[]).forEach(sc=>{
    const proj = projectPatrimoine(sc.id);
    series.push({label: sc.nom, color: sc.color, dash:'6,4', points: sample(proj.points)});
    if(state.emprunts.length) costLines.push(`${sc.nom} : ${fmtEUR(proj.totalInterets)} d'intérêts et ${fmtEUR(proj.totalAssurance)} d'assurance`);
  });
  const costNote = state.emprunts.length? `<div class="sub" style="margin-top:12px">${costLines.join(' · ')}</div>` : '';
  const chart = svgLineChart(series);
  projectionChartActivate = chart.activate;
  return chart.html + costNote;
}

// ---- FISCALITÉ ----
// Estimation simplifiée : taux forfaitaire appliqué à la plus-value latente. Ne tient PAS compte de l'ancienneté du
// contrat, des abattements annuels, des seuils, ni de la situation personnelle — à affiner avec un professionnel.
const DEFAULT_IR_RATES = {'Assurance-vie':7.5,'PEA':0,'Compte-titres':12.8,'Livret/épargne':0,'PER':30,'FIP':0,'PEE':0,'SCPI':19,'Immobilier':19,'Crypto':12.8,'Autre':12.8};
const DEFAULT_PS_RATES = {'Assurance-vie':17.2,'PEA':17.2,'Compte-titres':17.2,'Livret/épargne':0,'PER':0,'FIP':17.2,'PEE':17.2,'SCPI':17.2,'Immobilier':17.2,'Crypto':17.2,'Autre':17.2};
function netInvested(supportId){
  return state.mouvements.filter(m=>m.supportId===supportId).reduce((s,m)=> s + (m.type==='versement'?m.montant : m.type==='retrait'?-m.montant:0), 0);
}
function irRateFor(s){
  return (s.tauxFiscal!==undefined && s.tauxFiscal!==null) ? s.tauxFiscal : (DEFAULT_IR_RATES[s.type]!==undefined ? DEFAULT_IR_RATES[s.type] : 12.8);
}
function psRateFor(s){
  return (s.tauxPS!==undefined && s.tauxPS!==null) ? s.tauxPS : (DEFAULT_PS_RATES[s.type]!==undefined ? DEFAULT_PS_RATES[s.type] : 17.2);
}
function viewFiscalite(){
  if(state.supports.length===0) return `<div class="card"><div class="empty">Ajoute d'abord des supports pour estimer la fiscalité.</div></div>`;
  let totalPV=0, totalImpot=0, totalNet=0, totalBrut=0;
  const rows = state.supports.map(s=>{
    const val = displayValue(s.id, null);
    const brut = val ? val.value : 0;
    const invested = netInvested(s.id);
    const plusValue = brut - invested;
    const irRate = irRateFor(s), psRate = psRateFor(s);
    const impot = plusValue>0 ? plusValue*(irRate+psRate)/100 : 0;
    const net = brut - impot;
    totalPV += plusValue; totalImpot += impot; totalNet += net; totalBrut += brut;
    return `<tr>
      <td class="label-cell">${s.nom}</td>
      <td class="label-cell"><span class="pill">${s.type}</span></td>
      <td>${fmtEUR(brut)}</td>
      <td class="${plusValue>=0?'pos':'neg'}">${fmtEUR(plusValue)}</td>
      <td><input class="fiscal-rate-ir" data-support="${s.id}" type="number" inputmode="decimal" step="0.1" style="width:64px" value="${irRate}"> %</td>
      <td><input class="fiscal-rate-ps" data-support="${s.id}" type="number" inputmode="decimal" step="0.1" style="width:64px" value="${psRate}"> %</td>
      <td class="neg">${fmtEUR(impot)}</td>
      <td class="mono">${fmtEUR(net)}</td>
    </tr>`;
  }).join('');
  return `
  <div class="card">
    <h3>Simulation de fiscalité (estimation)</h3>
    <div class="helptext">Calcul simplifié : taux forfaitaires appliqués à la plus-value latente (valeur actuelle − net versé) — impôt sur le revenu (IR) et prélèvements sociaux (PS, 17,2 % par défaut). Des taux par défaut sont proposés selon le type de support, modifiables ligne par ligne. <strong>Ce n'est ni un calcul officiel ni un conseil fiscal</strong> — il ignore l'ancienneté du contrat, les abattements annuels, les seuils et ta situation personnelle. Vérifie avec un professionnel avant toute décision.</div>
    <table><thead><tr><th>Support</th><th>Type</th><th>Valeur brute</th><th>Plus-value latente</th><th>Taux IR</th><th>Taux PS</th><th>Impôt estimé</th><th>Valeur nette d'impôt</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="font-weight:600;border-top:2px solid var(--line)">
      <td class="label-cell" colspan="2">Total</td>
      <td>${fmtEUR(totalBrut)}</td>
      <td class="${totalPV>=0?'pos':'neg'}">${fmtEUR(totalPV)}</td>
      <td></td><td></td>
      <td class="neg">${fmtEUR(totalImpot)}</td>
      <td class="mono">${fmtEUR(totalNet)}</td>
    </tr></tfoot>
    </table>
  </div>`;
}

function attachHandlers(tab){

  attachDateMasks(document);

  if(tab==='dashboard'){
    if(evolutionChartActivate) evolutionChartActivate();

    });

    const gd = document.getElementById('groupDetailChk'); if(gd) gd.onchange = ()=>{ dashboardShowDetail = gd.checked; renderTab('dashboard'); };
  }

  if(tab==='supports'){

      const map = new Map(state.supports.map(s=>[s.id,s]));

      saveState(); renderTab('supports');
    });
    enableRowDragReorder(document.getElementById('typesTable'), ids=>{
      state.types = ids.map(i=>state.types[Number(i)]);
      saveState(); renderTab('supports');
    });
    enableRowDragReorder(document.getElementById('dispoTable'), ids=>{
      state.dispos = ids.map(i=>state.dispos[Number(i)]);
      saveState(); renderTab('supports');
    });
    document.querySelectorAll('[data-edit-support]').forEach(b=>b.onclick=()=>openSupportModal(b.dataset.editSupport));
    document.querySelectorAll('[data-del-support]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.delSupport;
      state.supports=state.supports.filter(s=>s.id!==id);
      state.mouvements=state.mouvements.filter(m=>m.supportId!==id);
      state.valorisations=state.valorisations.filter(v=>v.supportId!==id);
      state.actions=state.actions.filter(a=>a.supportId!==id);
      saveState(); renderAll();
    });
    document.querySelectorAll('.type-rename').forEach(inp=>{
      inp.onchange = ()=>{
        const idx = Number(inp.dataset.typeIdx);
        const oldVal = state.types[idx];
        const newVal = inp.value.trim();
        if(!newVal || newVal===oldVal){ inp.value=oldVal; return; }
        if(state.types.includes(newVal)){ alert('Ce type existe déjà.'); inp.value=oldVal; return; }
        state.types[idx]=newVal;
        state.supports.forEach(s=>{ if(s.type===oldVal) s.type=newVal; });
        saveState(); renderTab('supports');
      };
    });
    document.querySelectorAll('[data-del-type]').forEach(b=>b.onclick=()=>{
      const t = b.dataset.delType;
      if(state.supports.some(s=>s.type===t)){ alert("Impossible de supprimer : ce type est utilisé par au moins un support."); return; }
      state.types = state.types.filter(x=>x!==t);
      saveState(); renderTab('supports');
    });
    const ft = document.getElementById('formType');
    if(ft) ft.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(ft); const nt=(fd.get('newType')||'').trim();
      if(nt && !state.types.includes(nt)) state.types.push(nt);
      saveState(); renderTab('supports');
    };
    document.querySelectorAll('.dispo-rename').forEach(inp=>{
      inp.onchange = ()=>{
        const idx = Number(inp.dataset.dispoIdx);
        const oldVal = state.dispos[idx];
        const newVal = inp.value.trim();
        if(!newVal || newVal===oldVal){ inp.value=oldVal; return; }
        if(state.dispos.includes(newVal)){ alert('Ce type de disponibilité existe déjà.'); inp.value=oldVal; return; }
        state.dispos[idx]=newVal;
        state.supports.forEach(s=>{ if(s.disponibilite===oldVal) s.disponibilite=newVal; });
        saveState(); renderTab('supports');
      };
    });
    document.querySelectorAll('[data-del-dispo]').forEach(b=>b.onclick=()=>{
      const t = b.dataset.delDispo;
      if(state.supports.some(s=>s.disponibilite===t)){ alert("Impossible de supprimer : ce type de disponibilité est utilisé par au moins un support."); return; }
      state.dispos = state.dispos.filter(x=>x!==t);
      saveState(); renderTab('supports');
    });
    const fd2 = document.getElementById('formDispo');
    if(fd2) fd2.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(fd2); const nt=(fd.get('newDispo')||'').trim();
      if(nt && !state.dispos.includes(nt)) state.dispos.push(nt);
      saveState(); renderTab('supports');
    };
    const fx = document.getElementById('formTaux');
    if(fx) fx.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(fx);
