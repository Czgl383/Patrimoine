      if(sup){ if(!sup.tauxAnnonces) sup.tauxAnnonces={}; sup.tauxAnnonces[fd.get('annee')] = Number(fd.get('taux')); saveState(); renderTab('supports'); }
    };
    document.querySelectorAll('[data-del-taux]').forEach(b=>b.onclick=()=>{
      const [supId, annee] = b.dataset.delTaux.split('|');
      const sup = state.supports.find(s=>s.id===supId);
      if(sup && sup.tauxAnnonces){ delete sup.tauxAnnonces[annee]; saveState(); renderTab('supports'); }
    });
  }

  if(tab==='mouvements'){
    const openBtn = document.getElementById('openAddMouvementBtn'); if(openBtn) openBtn.onclick = ()=>openMouvementModal(null);
    const fSup = document.getElementById('mvtFilterSupport');
    if(fSup) fSup.onchange = ()=>{ mouvementsFilter.supportId = fSup.value; renderTab('mouvements'); };
    const fSince = document.getElementById('mvtFilterSince');
    if(fSince) fSince.addEventListener('change', ()=>{ mouvementsFilter.since = frToIso(fSince.value)||''; renderTab('mouvements'); });
    const fUntil = document.getElementById('mvtFilterUntil');
    if(fUntil) fUntil.addEventListener('change', ()=>{ mouvementsFilter.until = frToIso(fUntil.value)||''; renderTab('mouvements'); });
    const fReset = document.getElementById('mvtFilterReset');
    if(fReset) fReset.onclick = ()=>{ mouvementsFilter = {supportId:'', since:'', until:''}; renderTab('mouvements'); };
    document.querySelectorAll('[data-edit-mouvement]').forEach(b=>b.onclick=()=>openMouvementModal(b.dataset.editMouvement));
    document.querySelectorAll('[data-del-mouvement]').forEach(b=>b.onclick=()=>{ state.mouvements=state.mouvements.filter(m=>m.id!==b.dataset.delMouvement); saveState(); renderAll(); });
  }

  if(tab==='actions'){
    const openBtn = document.getElementById('openAddActionBtn'); if(openBtn) openBtn.onclick = ()=>openActionModal(null);
    document.querySelectorAll('[data-edit-action]').forEach(b=>b.onclick=()=>openActionModal(b.dataset.editAction));
    document.querySelectorAll('[data-del-action]').forEach(b=>b.onclick=()=>{ state.actions=state.actions.filter(a=>a.id!==b.dataset.delAction); saveState(); renderAll(); });
    document.querySelectorAll('[data-refresh-action]').forEach(b=>b.onclick=()=>refreshActionPrice(b.dataset.refreshAction));
    const refreshAll = document.getElementById('refreshAllActionsBtn'); if(refreshAll) refreshAll.onclick = refreshAllActionPrices;
  }

  if(tab==='valorisations'){
    const openBtn = document.getElementById('openAddValoBtn'); if(openBtn) openBtn.onclick = ()=>openValoModal(null);
    document.querySelectorAll('[data-edit-valo]').forEach(b=>b.onclick=()=>openValoModal(b.dataset.editValo));
    document.querySelectorAll('[data-del-valo]').forEach(b=>b.onclick=()=>{ state.valorisations=state.valorisations.filter(v=>v.id!==b.dataset.delValo); saveState(); renderAll(); });
  }

  if(tab==='emprunts'){
    const openBtn = document.getElementById('openAddEmpruntBtn'); if(openBtn) openBtn.onclick = ()=>openEmpruntModal(null);
    document.querySelectorAll('[data-edit-emprunt]').forEach(b=>b.onclick=()=>openEmpruntModal(b.dataset.editEmprunt));
    document.querySelectorAll('[data-del-emprunt]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.delEmprunt;
      state.emprunts=state.emprunts.filter(x=>x.id!==id);
      state.remboursementsAnticipes=state.remboursementsAnticipes.filter(p=>p.empruntId!==id);
      saveState(); renderAll();
    });
    const fp = document.getElementById('formPrepay');
    if(fp) fp.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(fp);
      const isoP = frToIso(fd.get('date'));
      if(!isoP){ alert('Date invalide : utilise le format JJ/MM/AAAA.'); return; }
      state.remboursementsAnticipes.push({id:uid(), empruntId:fd.get('empruntId'), date:isoP, montant:Number(fd.get('montant')), mode:fd.get('mode')});
      saveState(); renderAll();
    };
    document.querySelectorAll('[data-del-prepay]').forEach(b=>b.onclick=()=>{ state.remboursementsAnticipes=state.remboursementsAnticipes.filter(p=>p.id!==b.dataset.delPrepay); saveState(); renderAll(); });
  }

  if(tab==='projections'){
    if(projectionChartActivate) projectionChartActivate();
    document.querySelectorAll('[data-hyp]').forEach(inp=>inp.onchange=()=>{ state.projection.hypotheses[inp.dataset.hyp]=Number(inp.value); saveState(); renderTab('projections'); });
    const hz = document.getElementById('horizonInput'); if(hz) hz.onchange=()=>{ state.projection.horizonAnnees=Number(hz.value); saveState(); renderTab('projections'); };
    const fsc = document.getElementById('formScenario');
    if(fsc) fsc.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(fsc); const nom=(fd.get('nom')||'').trim();
      if(nom){ const color = CHART_PALETTE[state.projection.scenarios.length % CHART_PALETTE.length]; state.projection.scenarios.push({id:uid(), nom, color}); saveState(); renderTab('projections'); }
    };
    document.querySelectorAll('.scenario-rename').forEach(inp=>{
      inp.onchange = ()=>{ const sc=state.projection.scenarios.find(x=>x.id===inp.dataset.scenarioId); if(sc){ sc.nom=inp.value.trim()||sc.nom; saveState(); renderTab('projections'); } };
    });
    document.querySelectorAll('.scenario-color').forEach(inp=>{
      inp.onchange = ()=>{ const sc=state.projection.scenarios.find(x=>x.id===inp.dataset.scenarioId); if(sc){ sc.color=inp.value; saveState(); renderTab('projections'); } };
    });
    document.querySelectorAll('[data-del-scenario]').forEach(b=>b.onclick=()=>{
      const id = b.dataset.delScenario;
      if(!confirm('Supprimer ce scénario ? Les événements qui lui sont rattachés repasseront en "Commun".')) return;
      state.projection.scenarios = state.projection.scenarios.filter(s=>s.id!==id);
      state.projection.versementsRecurrents.forEach(v=>{ if(v.scenarioId===id) v.scenarioId=null; });
      state.projection.remboursementsSimules.forEach(r=>{ if(r.scenarioId===id) r.scenarioId=null; });
      if(projectionSelectedScenario===id) projectionSelectedScenario=null;
      saveState(); renderTab('projections');
    });
    document.querySelectorAll('.scenario-ctx-btn').forEach(b=>b.onclick=()=>{ projectionSelectedScenario = b.dataset.ctx||null; renderTab('projections'); });
    const fvr = document.getElementById('formVR');
    if(fvr) fvr.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(fvr);
      const rawFin=(fd.get('dateFin')||'').trim();
      let isoFin=null;
      if(rawFin){ isoFin=frToIso(rawFin); if(!isoFin){ alert('Date de fin invalide : utilise le format JJ/MM/AAAA.'); return; } }
      state.projection.versementsRecurrents.push({id:uid(), supportId:fd.get('supportId'), montant:Number(fd.get('montant')), dateFin:isoFin, scenarioId:projectionSelectedScenario});
      saveState(); renderTab('projections');
    };
    document.querySelectorAll('[data-del-vr]').forEach(b=>b.onclick=()=>{ state.projection.versementsRecurrents=state.projection.versementsRecurrents.filter(v=>v.id!==b.dataset.delVr); saveState(); renderTab('projections'); });
    const frs = document.getElementById('formRS');
    if(frs) frs.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(frs);
      const isoRS = frToIso(fd.get('date'));
      if(!isoRS){ alert('Date invalide : utilise le format JJ/MM/AAAA.'); return; }
      state.projection.remboursementsSimules.push({id:uid(), empruntId:fd.get('empruntId'), date:isoRS, montant:Number(fd.get('montant')), sourceSupportId:fd.get('sourceSupportId')||null, mode:fd.get('mode')||'duree', scenarioId:projectionSelectedScenario});
      saveState(); renderTab('projections');
    };
    document.querySelectorAll('[data-del-rs]').forEach(b=>b.onclick=()=>{ state.projection.remboursementsSimules=state.projection.remboursementsSimules.filter(r=>r.id!==b.dataset.delRs); saveState(); renderTab('projections'); });
  }

  if(tab==='offres'){
    const sel = document.getElementById('offresSupportSel');
    if(sel){ sel.onchange = ()=>renderOfferLinks(sel.value); if(sel.value) renderOfferLinks(sel.value); }
  }

  if(tab==='fiscalite'){
    document.querySelectorAll('.fiscal-rate-ir').forEach(inp=>{
      inp.onchange = ()=>{ const s=state.supports.find(x=>x.id===inp.dataset.support); if(!s) return; const v=inp.value.trim(); s.tauxFiscal = v===''?null:Number(v); saveState(); renderTab('fiscalite'); };
    });
    document.querySelectorAll('.fiscal-rate-ps').forEach(inp=>{
      inp.onchange = ()=>{ const s=state.supports.find(x=>x.id===inp.dataset.support); if(!s) return; const v=inp.value.trim(); s.tauxPS = v===''?null:Number(v); saveState(); renderTab('fiscalite'); };
    });
  }
}

document.getElementById('driveConnectBtn').onclick = ()=>{ googleAccessToken ? disconnectDrive() : connectDrive(); };
document.querySelectorAll('[data-icon]').forEach(el=>{ if(ICONS[el.dataset.icon]) el.innerHTML = ICONS[el.dataset.icon]; });
document.getElementById('moreTabBtn').onclick = openMoreSheet;
document.getElementById('settingsMenuBtn').onclick = openSettingsMenu;
document.getElementById('switchDossierBtn').onclick = ()=>{ if(confirm('Fermer ce dossier et revenir à la liste des dossiers ?')) lockDossier(); };
document.getElementById('dossierSettingsBtn').onclick = appSecurityModal;
document.getElementById('lockAppBtn').onclick = ()=>{ if(confirm('Verrouiller l\'application ? Le mot de passe sera de nouveau demandé.')) lockApp(); };
document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'grand-livre-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importCsvBtn').onclick = openCsvImportModal;
document.getElementById('importFile').onchange = e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const imported = JSON.parse(reader.result);
      if(!confirm('Importer ce fichier remplacera toutes les données actuellement affichées. Continuer ?')) return;
      state = Object.assign(state, imported);
      saveState(); renderAll();
    }catch(err){ alert('Fichier invalide : '+err.message); }
    e.target.value = '';
  };
  reader.readAsText(file);
};
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && drivePushPending) drivePushFlush(); });
window.addEventListener('pagehide', ()=>{ if(drivePushPending) drivePushFlush(); });

(async ()=>{
  await loadIndex();
  // migration : si un ancien fichier mono-dossier existait avant cette mise à jour, on le récupère dans un premier dossier
  if(dossierIndex.length===0){
    const legacy = await storageGetRaw('patrimoine-state');
    if(legacy){
      const id = uid()+uid();
      dossierIndex.push({id, nom:'Mon dossier', hasPassword:false, salt:null, createdAt:new Date().toISOString()});
      await saveIndex();
      await storageSetRaw('grandlivre-dossier-'+id, legacy);
    }
  }
  showGate();
  // le script Google se charge en asynchrone : on attend qu'il soit prêt avant de tenter la reconnexion
  let tries = 0;
  const waitGoogle = setInterval(()=>{
    if(window.google && google.accounts){ clearInterval(waitGoogle); trySilentDriveReconnect(); }
    else if(++tries>25) clearInterval(waitGoogle);
  }, 200);
  // si la reconnexion silencieuse n'a rien donné après un court délai, on propose le choix explicitement
  setTimeout(()=>{
    if(!googleAccessToken && !driveGateSkipped && !(appLock.hasPassword && !masterKey) && document.getElementById('gateScreen').style.display!=='none'){
      renderGateConnect();
    }
  }, 3000);
})();
</script>
</body>
