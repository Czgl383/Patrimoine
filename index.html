function viewProjections(){
  if(state.supports.length===0 && state.emprunts.length===0) return `<div class="card"><div class="empty">Ajoute des supports et/ou emprunts pour lancer une projection.</div></div>`;
  const hypRows = state.supports.map(s=>`<tr>
    <td class="label-cell">${s.nom}</td>
    <td><input data-hyp="${s.id}" type="number" step="0.1" style="width:80px" value="${state.projection.hypotheses[s.id]!==undefined?state.projection.hypotheses[s.id]:3}"> %/an</td>
  </tr>`).join('');
  const supOpts = ()=>state.supports.map(sp=>`<option value="${sp.id}">${sp.nom}</option>`).join('');
  const empOpts = ()=>state.emprunts.map(e=>`<option value="${e.id}">${e.nom}</option>`).join('');
  const vrRows = state.projection.versementsRecurrents.map(v=>{
    const sup = state.supports.find(s=>s.id===v.supportId);
    return `<tr><td class="label-cell">${sup?sup.nom:'?'}</td><td>${fmtEUR(v.montant)}/mois</td><td>${v.dateFin?fmtDate(v.dateFin):'—'}</td>
    <td><span class="scenario-tag ${v.scenario==='arbitrage'?'scenario-arb':'scenario-both'}">${v.scenario==='arbitrage'?'Scénario arbitrage':'Toujours'}</span></td>
    <td><button class="btn-del" data-del-vr="${v.id}">Suppr.</button></td></tr>`;
  }).join('');
  const rsRows = state.projection.remboursementsSimules.map(r=>{
    const emp = state.emprunts.find(e=>e.id===r.empruntId);
    return `<tr><td class="label-cell">${emp?emp.nom:'?'}</td><td>${fmtDate(r.date)}</td><td>${fmtEUR(r.montant)}</td>
    <td><span class="scenario-tag ${r.scenario==='arbitrage'?'scenario-arb':'scenario-both'}">${r.scenario==='arbitrage'?'Scénario arbitrage':'Toujours'}</span></td>
    <td><button class="btn-del" data-del-rs="${r.id}">Suppr.</button></td></tr>`;
  }).join('');
  return `
  <div class="card">
    <h3>Hypothèses de rendement</h3>
    <div class="sub">Rendement annuel moyen supposé par support</div>
    ${state.supports.length? `<table><thead><tr><th>Support</th><th>Rendement</th></tr></thead><tbody>${hypRows}</tbody></table>`:'<div class="empty">Aucun support.</div>'}
    <div style="margin-top:14px" class="field"><label>Horizon de projection (années)</label><input id="horizonInput" type="number" min="1" max="40" value="${state.projection.horizonAnnees}" style="width:80px"></div>
  </div>
  <div class="card">
    <h3>Versements récurrents</h3>
    <div class="sub">Coche "scénario arbitrage" pour tester l'impact d'un versement récurrent optionnel</div>
    ${state.supports.length? `
    <form class="inline-form" id="formVR">
      <div class="field"><label>Support</label><select name="supportId">${supOpts()}</select></div>
      <div class="field"><label>Montant mensuel (€)</label><input name="montant" type="number" step="1" required></div>
      <div class="field"><label>Fin (optionnel)</label><input name="dateFin" type="date"></div>
      <div class="field"><label>Scénario</label><select name="scenario"><option value="both">Toujours actif</option><option value="arbitrage">Arbitrage seulement</option></select></div>
      <button class="btn" type="submit">Ajouter</button>
    </form>`:''}
    ${state.projection.versementsRecurrents.length? `<table><thead><tr><th>Support</th><th>Montant</th><th>Fin</th><th>Scénario</th><th></th></tr></thead><tbody>${vrRows}</tbody></table>`:'<div class="empty">Aucun versement récurrent.</div>'}
  </div>
  <div class="card">
    <h3>Remboursements anticipés simulés</h3>
    <div class="sub">Teste l'effet d'un remboursement anticipé futur sur le patrimoine net</div>
    ${state.emprunts.length? `
    <form class="inline-form" id="formRS">
      <div class="field"><label>Emprunt</label><select name="empruntId">${empOpts()}</select></div>
      <div class="field"><label>Date</label><input name="date" type="date" required></div>
      <div class="field"><label>Montant (€)</label><input name="montant" type="number" step="1" required></div>
      <div class="field"><label>Scénario</label><select name="scenario"><option value="arbitrage">Arbitrage seulement</option><option value="both">Toujours actif</option></select></div>
      <button class="btn" type="submit">Ajouter</button>
    </form>`: '<div class="empty">Aucun emprunt enregistré.</div>'}
    ${state.projection.remboursementsSimules.length? `<table><thead><tr><th>Emprunt</th><th>Date</th><th>Montant</th><th>Scénario</th><th></th></tr></thead><tbody>${rsRows}</tbody></table>`:''}
  </div>
  <div class="card">
    <h3>Patrimoine net projeté</h3>
    <div class="sub">Scénario de base (traits pleins) vs scénario avec arbitrage (pointillés)</div>
    ${renderProjectionChart()}
  </div>`;
}

function projectPatrimoine(includeArbitrage){
  const months = state.projection.horizonAnnees*12;
  const today = new Date();
  // support values
  let supVals = {};
  state.supports.forEach(s=>{ const v = displayValue(s.id,null); supVals[s.id]=v?v.value:0; });
  // loan capitals (start from today's remaining)
  let loanCap = {};
  state.emprunts.forEach(e=>{ loanCap[e.id]=loanRemainingToday(e); });
  const points = [];
  let totalInterets = 0, totalAssurance = 0;
  for(let m=0;m<=months;m++){
    const date = new Date(today); date.setMonth(date.getMonth()+m);
    const iso = date.toISOString().slice(0,10);
    if(m>0){
      // grow supports + recurring contributions
      state.supports.forEach(s=>{
        const rate = (state.projection.hypotheses[s.id]!==undefined?state.projection.hypotheses[s.id]:3)/100/12;
        supVals[s.id] = supVals[s.id]*(1+rate);
        state.projection.versementsRecurrents.filter(v=>v.supportId===s.id && (v.scenario==='both' || includeArbitrage) && (!v.dateFin || v.dateFin>=iso)).forEach(v=>{
          supVals[s.id]+=v.montant;
        });
      });
      // amortize loans (capital, intérêts et assurance)
      state.emprunts.forEach(e=>{
        if(loanCap[e.id]<=0.5) return;
        const rate = e.taux/100/12;
        const n = e.duree;
        const mensualite = e.type==='constant' ? (rate===0? e.capital/n : e.capital*rate/(1-Math.pow(1+rate,-n))) : e.capital*rate;
        const interet = loanCap[e.id]*rate;
        let principal = e.type==='constant' ? (mensualite-interet) : 0;
        const prepay = state.projection.remboursementsSimules.filter(r=>r.empruntId===e.id && r.date.slice(0,7)===iso.slice(0,7) && (r.scenario==='both' || includeArbitrage)).reduce((s,r)=>s+r.montant,0);
        loanCap[e.id] = Math.max(0, loanCap[e.id]-principal-prepay);
        totalInterets += interet;
        totalAssurance += loanInsuranceMonthly(e);
      });
    }
    const assets = Object.values(supVals).reduce((a,b)=>a+b,0);
    const debts = Object.values(loanCap).reduce((a,b)=>a+b,0);
    points.push({date: iso, net: assets-debts});
  }
  return {points, totalInterets, totalAssurance};
}
function renderProjectionChart(){
  if(state.supports.length===0 && state.emprunts.length===0) return '<div class="empty">Ajoute des supports ou des emprunts pour voir la projection.</div>';
  const base = projectPatrimoine(false);
  const arb = projectPatrimoine(true);
  const hasArb = state.projection.versementsRecurrents.some(v=>v.scenario==='arbitrage') || state.projection.remboursementsSimules.some(r=>r.scenario==='arbitrage');
  const sample = pts => pts.filter((_,i)=>i%3===0).map(p=>({y:Math.round(p.net), label:p.date.slice(0,7)}));
  const series = [{label:'Scénario de base', color:'#4F9C82', points: sample(base.points)}];
  if(hasArb) series.push({label:'Avec arbitrage', color:'#C9A65D', dash:'6,4', points: sample(arb.points)});
  const costNote = state.emprunts.length? `<div class="sub" style="margin-top:12px">Sur l'horizon (scénario de base) : ${fmtEUR(base.totalInterets)} d'intérêts et ${fmtEUR(base.totalAssurance)} d'assurance emprunt${hasArb?` · scénario avec arbitrage : ${fmtEUR(arb.totalInterets)} d'intérêts et ${fmtEUR(arb.totalAssurance)} d'assurance`:''}</div>` : '';
  return svgLineChart(series) + costNote;
}

// ---- OFFRES ----
// Comparateurs neutres identifiés par type de support (vérifiés) ; pour un type non couvert (FIP, PEE, Crypto,
// types personnalisés…) on retombe sur une recherche, plutôt que d'inventer un lien.
const OFFER_LINKS = {
  'Assurance-vie': [{title:'Comparatif assurance-vie — MoneyVox', url:'https://www.moneyvox.fr/assurance-vie/'}],
  'PEA': [{title:'Comparatif PEA / courtiers bourse — MoneyVox', url:'https://www.moneyvox.fr/bourse/'}],
  'Compte-titres': [{title:'Comparatif courtiers bourse — MoneyVox', url:'https://www.moneyvox.fr/bourse/'}],
  'Livret/épargne': [{title:'Comparatif des livrets — MoneyVox', url:'https://www.moneyvox.fr/livret/'}],
  'Immobilier': [{title:'Baromètre des taux de crédit immobilier — MoneyVox', url:'https://www.moneyvox.fr/credit/barometre-taux.php'}],
  'SCPI': [{title:'Comparatif SCPI — France SCPI', url:'https://francescpi.com/comparatif-scpi'}],
  'PER': [{title:'Comparatif PER — MoneyVox', url:'https://www.moneyvox.fr/retraite/plan-epargne-retraite.php'}],
};
function offerLinksForType(type){
  return OFFER_LINKS[type] || [{title:`Rechercher les meilleures offres — ${type}`, url:'https://www.google.com/search?q='+encodeURIComponent('comparatif meilleures offres '+type)}];
}
function viewOffres(){
  if(state.supports.length===0) return `<div class="card"><div class="empty">Ajoute d'abord un support dans l'onglet "Supports" pour voir les offres correspondant à son type.</div></div>`;
  const opts = state.supports.map(s=>`<option value="${s.id}">${s.nom} (${s.type})</option>`).join('');
  return `
  <div class="card">
    <h3>Offres actuelles du marché</h3>
    <div class="sub">Liens vers des comparateurs externes, selon le type du support choisi. Les taux et classements changent en continu — consulte le site pour les chiffres à jour ; ce ne sont pas des recommandations personnalisées.</div>
    <div class="field" style="max-width:300px;margin-top:14px">
      <label>Support</label>
      <select id="offresSupportSel">${opts}</select>
    </div>
    <div id="offresLinks" style="margin-top:18px"></div>
  </div>`;
}
function renderOfferLinks(supportId){
  const sup = state.supports.find(s=>s.id===supportId);
  const container = document.getElementById('offresLinks');
  if(!container) return;
  if(!sup){ container.innerHTML = '<div class="empty">Sélectionne un support.</div>'; return; }
  const links = offerLinksForType(sup.type);
  container.innerHTML = `<div class="sub" style="margin-bottom:10px">Type : ${sup.type}</div>` + links.map(l=>`
    <a href="${l.url}" target="_blank" rel="noopener" style="display:block;padding:12px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;color:var(--text);text-decoration:none">
      <div style="font-weight:600;font-size:13px">${l.title}</div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:2px">${l.url.replace(/^https?:\/\//,'').split('/')[0]}</div>
    </a>`).join('');
}

// ---------- HANDLERS ----------
function attachHandlers(tab){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); editing={}; renderTab(b.dataset.tab);
  });

  if(tab==='dashboard'){
    const ys = document.getElementById('dashboardYearSel');
    if(ys) ys.onchange = ()=>{ dashboardYear = Number(ys.value); renderTab('dashboard'); };
    document.querySelectorAll('.perf-link').forEach(b=>b.onclick=()=>{
      openXIRRDetail(b.dataset.ids.split(','), b.dataset.since||null, b.dataset.until||null, b.dataset.title);
    });
    const gbt = document.getElementById('groupByTypeChk'); if(gbt) gbt.onchange = ()=>{ dashboardGroupByType = gbt.checked; renderTab('dashboard'); };
    const gd = document.getElementById('groupDetailChk'); if(gd) gd.onchange = ()=>{ dashboardShowDetail = gd.checked; renderTab('dashboard'); };
  }

  if(tab==='supports'){
    const f = document.getElementById('formSupport');
    f.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(f);
      const dispoRaw = (fd.get('dateDisponibilite')||'').trim();
      let dateDisponibilite = null;
      if(dispoRaw){ dateDisponibilite = frToIso(dispoRaw); if(!dateDisponibilite){ alert('Date de disponibilité invalide : utilise le format JJ/MM/AAAA.'); return; } }
      const obj = {nom:fd.get('nom'), type:fd.get('type'), disponibilite:fd.get('disponibilite'), dateDisponibilite, delaiJouissance:Number(fd.get('delaiJouissance')||0)};
      if(editing.support){ Object.assign(state.supports.find(s=>s.id===editing.support), obj); editing.support=null; }
      else state.supports.push({id:uid(), tauxAnnonces:{}, ...obj});
      saveState(); renderAll();
    };
    const cancel = document.getElementById('cancelEditSupport'); if(cancel) cancel.onclick=()=>{editing.support=null; renderTab('supports');};
    document.querySelectorAll('[data-edit-support]').forEach(b=>b.onclick=()=>{editing.support=b.dataset.editSupport; renderTab('supports');});
    document.querySelectorAll('[data-del-support]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.delSupport;
      state.supports=state.supports.filter(s=>s.id!==id);
      state.mouvements=state.mouvements.filter(m=>m.supportId!==id);
      state.valorisations=state.valorisations.filter(v=>v.supportId!==id);
      state.actions=state.actions.filter(a=>a.supportId!==id);
      saveState(); renderAll();
    });
    document.querySelectorAll('.type-rename').forEach(inp=>{
      inp.onchange = ()=>{
        const idx = Number(inp.dataset.typeIdx);
        const oldVal = state.types[idx];
        const newVal = inp.value.trim();
        if(!newVal || newVal===oldVal){ inp.value=oldVal; return; }
        if(state.types.includes(newVal)){ alert('Ce type existe déjà.'); inp.value=oldVal; return; }
        state.types[idx]=newVal;
        state.supports.forEach(s=>{ if(s.type===oldVal) s.type=newVal; });
        saveState(); renderTab('supports');
      };
    });
    document.querySelectorAll('[data-del-type]').forEach(b=>b.onclick=()=>{
      const t = b.dataset.delType;
      if(state.supports.some(s=>s.type===t)){ alert("Impossible de supprimer : ce type est utilisé par au moins un support."); return; }
      state.types = state.types.filter(x=>x!==t);
      saveState(); renderTab('supports');
    });
    const ft = document.getElementById('formType');
    if(ft) ft.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(ft); const nt=(fd.get('newType')||'').trim();
      if(nt && !state.types.includes(nt)) state.types.push(nt);
      saveState(); renderTab('supports');
    };
    const fx = document.getElementById('formTaux');
    if(fx) fx.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(fx);
      const sup = state.supports.find(s=>s.id===fd.get('supportId'));
      if(sup){ if(!sup.tauxAnnonces) sup.tauxAnnonces={}; sup.tauxAnnonces[fd.get('annee')] = Number(fd.get('taux')); saveState(); renderTab('supports'); }
    };
    document.querySelectorAll('[data-del-taux]').forEach(b=>b.onclick=()=>{
      const [supId, annee] = b.dataset.delTaux.split('|');
      const sup = state.supports.find(s=>s.id===supId);
      if(sup && sup.tauxAnnonces){ delete sup.tauxAnnonces[annee]; saveState(); renderTab('supports'); }
    });
  }

  if(tab==='mouvements'){
    const typeSel = document.getElementById('mvtType');
    if(typeSel) typeSel.onchange = ()=>{ const rf=document.getElementById('rattachementField'); if(rf) rf.style.display = typeSel.value==='interet' ? '' : 'none'; };
    const f = document.getElementById('formMouvement');
    if(f) f.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(f);
      const iso = frToIso(fd.get('date'));
      if(!iso){ alert('Date invalide : utilise le format JJ/MM/AAAA.'); return; }
      const type = fd.get('type');
      const obj={supportId:fd.get('supportId'), date:iso, type, montant:Math.abs(Number(fd.get('montant'))),
        anneeRattachement: type==='interet' ? Number(fd.get('anneeRattachement')) : null,
        fraisMontant:fd.get('fraisMontant')?Number(fd.get('fraisMontant')):null, fraisPourcent:fd.get('fraisPourcent')?Number(fd.get('fraisPourcent')):null};
      lastSupportId = obj.supportId;
      if(editing.mouvement){ Object.assign(state.mouvements.find(m=>m.id===editing.mouvement), obj); editing.mouvement=null; }
      else state.mouvements.push({id:uid(), ...obj});
      saveState(); renderAll();
    };
    const cancel = document.getElementById('cancelEditMouvement'); if(cancel) cancel.onclick=()=>{editing.mouvement=null; renderTab('mouvements');};
    document.querySelectorAll('[data-edit-mouvement]').forEach(b=>b.onclick=()=>{editing.mouvement=b.dataset.editMouvement; renderTab('mouvements');});
    document.querySelectorAll('[data-del-mouvement]').forEach(b=>b.onclick=()=>{ state.mouvements=state.mouvements.filter(m=>m.id!==b.dataset.delMouvement); saveState(); renderAll(); });
  }

  if(tab==='actions'){
    const f = document.getElementById('formAction');
    if(f) f.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(f);
      const obj = {supportId:fd.get('supportId'), nom:fd.get('nom'), ticker:(fd.get('ticker')||'').trim()||null,
        quantite:Number(fd.get('quantite')), pru:Number(fd.get('pru')), coursActuel:Number(fd.get('coursActuel')),
        coursCible: fd.get('coursCible')?Number(fd.get('coursCible')):null};
      if(editing.action){ Object.assign(state.actions.find(a=>a.id===editing.action), obj); editing.action=null; }
      else state.actions.push({id:uid(), ...obj});
      saveState(); renderAll();
    };
    const cancel = document.getElementById('cancelEditAction'); if(cancel) cancel.onclick=()=>{editing.action=null; renderTab('actions');};
    document.querySelectorAll('[data-edit-action]').forEach(b=>b.onclick=()=>{editing.action=b.dataset.editAction; renderTab('actions');});
    document.querySelectorAll('[data-del-action]').forEach(b=>b.onclick=()=>{ state.actions=state.actions.filter(a=>a.id!==b.dataset.delAction); saveState(); renderAll(); });
  }

  if(tab==='valorisations'){
    const f = document.getElementById('formValo');
    if(f) f.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(f);
      const obj={supportId:fd.get('supportId'), date:fd.get('date'), value:Number(fd.get('value'))};
      if(editing.valo){ Object.assign(state.valorisations.find(v=>v.id===editing.valo), obj); editing.valo=null; }
      else state.valorisations.push({id:uid(), ...obj});
      saveState(); renderAll();
    };
    const cancel = document.getElementById('cancelEditValo'); if(cancel) cancel.onclick=()=>{editing.valo=null; renderTab('valorisations');};
    document.querySelectorAll('[data-edit-valo]').forEach(b=>b.onclick=()=>{editing.valo=b.dataset.editValo; renderTab('valorisations');});
    document.querySelectorAll('[data-del-valo]').forEach(b=>b.onclick=()=>{ state.valorisations=state.valorisations.filter(v=>v.id!==b.dataset.delValo); saveState(); renderAll(); });
  }

  if(tab==='emprunts'){
    const f = document.getElementById('formEmprunt');
    if(f) f.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(f);
      const obj={nom:fd.get('nom'), capital:Number(fd.get('capital')), taux:Number(fd.get('taux')), duree:Number(fd.get('duree')), dateDebut:fd.get('dateDebut'), type:fd.get('type'), assuranceType:fd.get('assuranceType'), assuranceValeur: fd.get('assuranceValeur')?Number(fd.get('assuranceValeur')):null};
      if(editing.emprunt){ Object.assign(state.emprunts.find(x=>x.id===editing.emprunt), obj); editing.emprunt=null; }
      else state.emprunts.push({id:uid(), ...obj});
      saveState(); renderAll();
    };
    const cancel = document.getElementById('cancelEditEmprunt'); if(cancel) cancel.onclick=()=>{editing.emprunt=null; renderTab('emprunts');};
    document.querySelectorAll('[data-edit-emprunt]').forEach(b=>b.onclick=()=>{editing.emprunt=b.dataset.editEmprunt; renderTab('emprunts');});
    document.querySelectorAll('[data-del-emprunt]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.delEmprunt;
      state.emprunts=state.emprunts.filter(x=>x.id!==id);
      state.remboursementsAnticipes=state.remboursementsAnticipes.filter(p=>p.empruntId!==id);
      saveState(); renderAll();
    });
    const fp = document.getElementById('formPrepay');
    if(fp) fp.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(fp);
      state.remboursementsAnticipes.push({id:uid(), empruntId:fd.get('empruntId'), date:fd.get('date'), montant:Number(fd.get('montant')), mode:fd.get('mode')});
      saveState(); renderAll();
    };
    document.querySelectorAll('[data-del-prepay]').forEach(b=>b.onclick=()=>{ state.remboursementsAnticipes=state.remboursementsAnticipes.filter(p=>p.id!==b.dataset.delPrepay); saveState(); renderAll(); });
  }

  if(tab==='projections'){
    document.querySelectorAll('[data-hyp]').forEach(inp=>inp.onchange=()=>{ state.projection.hypotheses[inp.dataset.hyp]=Number(inp.value); saveState(); renderTab('projections'); });
    const hz = document.getElementById('horizonInput'); if(hz) hz.onchange=()=>{ state.projection.horizonAnnees=Number(hz.value); saveState(); renderTab('projections'); };
    const fvr = document.getElementById('formVR');
    if(fvr) fvr.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(fvr);
      state.projection.versementsRecurrents.push({id:uid(), supportId:fd.get('supportId'), montant:Number(fd.get('montant')), dateFin:fd.get('dateFin')||null, scenario:fd.get('scenario')});
      saveState(); renderTab('projections');
    };
    document.querySelectorAll('[data-del-vr]').forEach(b=>b.onclick=()=>{ state.projection.versementsRecurrents=state.projection.versementsRecurrents.filter(v=>v.id!==b.dataset.delVr); saveState(); renderTab('projections'); });
    const frs = document.getElementById('formRS');
    if(frs) frs.onsubmit = e=>{ e.preventDefault(); const fd=new FormData(frs);
      state.projection.remboursementsSimules.push({id:uid(), empruntId:fd.get('empruntId'), date:fd.get('date'), montant:Number(fd.get('montant')), scenario:fd.get('scenario')});
      saveState(); renderTab('projections');
    };
    document.querySelectorAll('[data-del-rs]').forEach(b=>b.onclick=()=>{ state.projection.remboursementsSimules=state.projection.remboursementsSimules.filter(r=>r.id!==b.dataset.delRs); saveState(); renderTab('projections'); });
  }

  if(tab==='offres'){
    const sel = document.getElementById('offresSupportSel');
    if(sel){ sel.onchange = ()=>renderOfferLinks(sel.value); if(sel.value) renderOfferLinks(sel.value); }
  }
}

document.getElementById('driveConnectBtn').onclick = ()=>{ googleAccessToken ? disconnectDrive() : connectDrive(); };
document.getElementById('switchDossierBtn').onclick = ()=>{ if(confirm('Fermer ce dossier et revenir à la liste des dossiers ?')) lockDossier(); };
document.getElementById('dossierSettingsBtn').onclick = securityModal;
document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'grand-livre-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const imported = JSON.parse(reader.result);
      if(!confirm('Importer ce fichier remplacera toutes les données actuellement affichées. Continuer ?')) return;
      state = Object.assign(state, imported);
      saveState(); renderAll();
    }catch(err){ alert('Fichier invalide : '+err.message); }
    e.target.value = '';
  };
  reader.readAsText(file);
};
(async ()=>{
  await loadIndex();
  // migration : si un ancien fichier mono-dossier existait avant cette mise à jour, on le récupère dans un premier dossier
  if(dossierIndex.length===0){
    const legacy = await storageGetRaw('patrimoine-state');
    if(legacy){
      const id = uid()+uid();
      dossierIndex.push({id, nom:'Mon dossier', hasPassword:false, salt:null, createdAt:new Date().toISOString()});
      await saveIndex();
      await storageSetRaw('grandlivre-dossier-'+id, legacy);
    }
  }
  showGate();
})();
</script>
